<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0e1117;color:#c9ced8;font:13px system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;user-select:none}
#app{display:grid;grid-template-columns:50px 1fr 240px;grid-template-rows:42px 1fr;height:100%;transition:grid-template-columns .2s ease}
#app.wl-collapsed{grid-template-columns:50px 1fr 0px}

/* Top bar */
#top{grid-column:1/4;display:flex;align-items:center;gap:6px;padding:0 8px;background:#151a23;border-bottom:1px solid #232a36;overflow-x:auto;white-space:nowrap;z-index:4}
#brand{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;letter-spacing:-0.2px;padding-right:10px;border-right:1px solid #232a36;flex-shrink:0;cursor:pointer}
#brand svg{flex-shrink:0}

/* Left Tools Toolbar (TradingView style) */
#tools{background:#151a23;border-right:1px solid #232a36;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;overflow-y:auto;z-index:3}
#tools button,#tools .tool-btn{width:36px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid transparent;background:transparent;color:#9aa3b2;cursor:pointer;transition:all .15s ease}
#tools button:hover{background:#1d2430;color:#fff}
#tools button.on{background:#2962ff;border-color:#2962ff;color:#fff;box-shadow:0 0 10px rgba(41,98,255,.45)}
#tools .sep{width:26px;height:1px;background:#232a36;margin:3px 0}
#tools select{width:38px;padding:2px;font-size:11px}
#tools input[type=color]{width:34px;height:24px;padding:0;border:none;border-radius:4px;cursor:pointer}

/* Center chart canvas */
#cw{position:relative;min-width:0;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;cursor:crosshair;touch-action:none}
#ohlc{position:absolute;left:10px;top:8px;font-size:12px;pointer-events:none;color:#9aa3b2;display:flex;gap:8px;align-items:center;background:rgba(21,26,35,.75);padding:3px 8px;border-radius:4px;backdrop-filter:blur(4px)}

/* Right Watchlist Panel */
#wl{background:#151a23;border-left:1px solid #232a36;display:flex;flex-direction:column;height:100%;overflow:hidden;z-index:3}
#wl-head{display:flex;align-items:center;gap:6px;padding:8px;border-bottom:1px solid #232a36;background:#181e28}
#wl-head span{font-weight:600;font-size:12px;color:#fff;flex:1}
#wi{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:1px;padding:4px}
.wi{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;cursor:pointer;transition:background .15s ease;font-size:12px}
.wi:hover{background:#1d2430}
.wi.active{background:#1e2738;border:1px solid #2962ff}
.wi .sym-icon{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;color:#fff;flex-shrink:0}
.wi .sym-info{display:flex;flex-direction:column;flex:1;min-width:0}
.wi .sym-name{font-weight:600;color:#e1e5ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wi .sym-src{font-size:10px;color:#6b7280;text-transform:uppercase}
.wi .sym-price{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.wi .p-val{font-weight:600;color:#fff;font-size:12px}
.wi .p-chg{font-size:10px;font-weight:600;padding:1px 4px;border-radius:3px}
.wi .p-chg.up{background:rgba(38,166,154,.18);color:#26a69a}
.wi .p-chg.dn{background:rgba(239,83,80,.18);color:#ef5350}
.wi .del-btn{color:#556;font-size:13px;padding:2px 4px;border-radius:3px;opacity:0;transition:opacity .15s ease}
.wi:hover .del-btn{opacity:1}
.wi .del-btn:hover{color:#ef5350;background:rgba(239,83,80,.1)}
#wl-foot{padding:8px;border-top:1px solid #232a36;background:#151a23}
#wadd{width:100%;font-size:11px;padding:6px;display:flex;align-items:center;justify-content:center;gap:4px}

/* Common form elements */
button,select,input{font:inherit;color:inherit;background:#1d2430;border:1px solid #2a3342;border-radius:5px;padding:4px 8px}
button{cursor:pointer}button:hover{background:#273042}
button.on{background:#2962ff;border-color:#2962ff;color:#fff}
#st{margin-left:auto;font-size:12px;color:#f0b429;display:flex;align-items:center;gap:6px}

/* Settings modal */
#set{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:99;backdrop-filter:blur(3px)}
#set[hidden]{display:none}
#set>div{background:#151a23;border:1px solid #2a3342;border-radius:8px;padding:18px;width:min(420px,94vw);max-height:90vh;overflow:auto;box-shadow:0 12px 36px rgba(0,0,0,.6)}
#set label{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:12px}
#set input[type=color]{width:50px;height:26px;padding:0}
#set p{font-size:12px;color:#8a919e;margin-top:12px;line-height:1.4}

/* Bar replay float */
#rp{position:absolute;left:50%;transform:translateX(-50%);bottom:30px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;justify-content:center;background:rgba(21,26,35,.94);border:1px solid #2a3342;border-radius:8px;padding:6px 10px;max-width:96%;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
#rp[hidden]{display:none}

/* Mobile responsive */
@media(max-width:700px){
#app{grid-template-columns:1fr;grid-template-rows:40px 1fr 48px}
#app.wl-collapsed{grid-template-columns:1fr}
#top{grid-column:1}#cw{grid-row:2}
#brand span{display:none}
#tools{grid-row:3;flex-direction:row;border-right:0;border-top:1px solid #232a36;padding:4px 6px calc(4px + env(safe-area-inset-bottom));overflow-x:auto;overflow-y:hidden;justify-content:flex-start}
#tools button{flex:none;width:40px;height:36px}#tools select,#tools input[type=color]{flex:none}
#tools .sep{width:1px;height:24px;margin:0 4px}
#wl{display:none;position:fixed;left:0;right:0;bottom:48px;max-height:60vh;border-top:1px solid #2a3342;z-index:90;box-shadow:0 -6px 20px rgba(0,0,0,.5)}
#wl.open{display:flex}
}
</style></head><body>

<script>
const $=id=>document.getElementById(id);
const LS=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch{return d}};
const SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};

const cfg=Object.assign({
 up:'#26a69a',dn:'#ef5350',wickUp:'#26a69a',wickDn:'#ef5350',bg:'#0e1117',grid:'#1a202b',
 fvgOn:true,fvgUp:'#2ecc71',fvgDn:'#e74c3c',fvgOp:0.25,fvgMin:0.02,fvgMax:30,fvgMit:false,gapFree:true,key:''
},LS('cfg',{}));

const S=Object.assign({src:'gate',sym:'BTC_USDT',tf:'1h'},LS('S',{}));

const wls=LS('wls',{
 Main:[
  {src:'gate',sym:'BTC_USDT'},
  {src:'gate',sym:'ETH_USDT'},
  {src:'gate',sym:'SOL_USDT'},
  {src:'gate',sym:'BNB_USDT'},
  {src:'gate',sym:'XRP_USDT'},
  {src:'fx',sym:'EUR/USD'},
  {src:'fx',sym:'XAU/USD'}
 ]
});
let wcur=LS('wcur','Main');if(!wls[wcur])wcur=Object.keys(wls)[0];

const NG={1:'1m',5:'5m',15:'15m',30:'30m',60:'1h',240:'4h',480:'8h',1440:'1d',10080:'7d',43200:'30d'};
const NB={1:'1m',3:'3m',5:'5m',15:'15m',30:'30m',60:'1h',120:'2h',240:'4h',360:'6h',480:'8h',720:'12h',1440:'1d',4320:'3d',10080:'1w',43200:'1M'};
const NF={1:'1min',5:'5min',15:'15min',30:'30min',45:'45min',60:'1h',120:'2h',240:'4h',1440:'1day',10080:'1week',43200:'1month'};
const FAV=['1m','5m','15m','30m','1h','4h','1d','1w','1M'];

const cv=$('cv'),ctx=cv.getContext('2d'),AX=70,AY=24;
let raw=[],D=[],fvgs=[],tfmin=60,base=60,tfms=36e5,atr=1,bw=8,off=6,W=0,H=0,pw=0,ph=0,lo=0,hi=1,m=null,raf=0,rb=0;
let tool='cursor',drs=[],sel=null,draft=null,drag=null,down=null,ws=null,poll=null,loadId=0,dw=2,dcol='#2962ff';
let Dfull=[],rp=null,hist=[],redoS=[],ptrs=new Map(),pinch=null,playT=0,cs=0;

// Magnet & Angle tools
let magnetOn=LS('magnetOn',false);
let angleSnapOn=LS('angleSnapOn',false);

const coarse=matchMedia('(pointer:coarse)').matches,TH=coarse?16:7,HR=coarse?20:9;

/* ---------- Helpers & Formatters ---------- */
const fmt=p=>p>=1000?p.toFixed(2):p>=100?p.toFixed(3):p>=1?p.toFixed(5):p.toFixed(6);
const rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`};
const nice=(r,t)=>{const s=r/t,p=10**Math.floor(Math.log10(s)),f=s/p;return(f<1.5?1:f<3?2:f<7?5:10)*p};
const idxAt=x=>(x-pw)/bw+D.length-1+off, xAt=i=>pw-(D.length-1+off-i)*bw;
const yAt=p=>(hi-p)/(hi-lo)*ph, pAt=y=>hi-y/ph*(hi-lo);

function idxOf(t){
 const n=D.length;
 if(t>=D[n-1].t)return n-1+(t-D[n-1].t)/tfms;
 if(t<=D[0].t)return(t-D[0].t)/tfms;
 let a=0,b=n-1;
 while(b-a>1){const k=(a+b)>>1;D[k].t<=t?a=k:b=k}
 return a+(t-D[a].t)/(D[b].t-D[a].t);
}
function tOf(i){
 const n=D.length;
 if(i>=n-1)return D[n-1].t+(i-n+1)*tfms;
 if(i<=0)return D[0].t+i*tfms;
 const a=Math.floor(i);
 return D[a].t+(i-a)*(D[a+1].t-D[a].t);
}
const X=t=>xAt(idxOf(t)),Y=p=>yAt(p);

// Magnet snapping logic (TradingView magnet feature)
function getSnapped(x,y){
 if(!magnetOn||!D.length)return{x,y,p:pAt(y),t:tOf(idxAt(x)),snapped:false};
 const curI=Math.round(idxAt(x));
 const i=Math.max(0,Math.min(D.length-1,curI));
 const b=D[i],curP=pAt(y);
 const levels=[b.o,b.h,b.l,b.c];
 let bestP=levels[0],minD=Math.abs(levels[0]-curP);
 for(let k=1;k<levels.length;k++){
  const d=Math.abs(levels[k]-curP);
  if(d<minD){minD=d;bestP=levels[k]}
 }
 return{x:xAt(i),y:yAt(bestP),p:bestP,t:b.t,snapped:true};
}

const pt=(x,y)=>{
 const sn=getSnapped(x,y);
 return{t:sn.t,p:sn.p};
};

const sched=()=>{if(!raf)raf=requestAnimationFrame(draw)};
const status=(s,e)=>{$('st').textContent=s||'';$('st').style.color=e?'#ef5350':'#f0b429'};

function tfParse(s){
 const r=/^(\d+)([mMhHdDwW])$/.exec(s.trim());if(!r)return null;
 const n=+r[1],u=r[2];if(!n)return null;
 const mult=u==='m'?1:u==='M'?43200:/[hH]/.test(u)?60:/[dD]/.test(u)?1440:10080;
 return{min:n*mult,label:n+(u==='m'||u==='M'?u:u.toLowerCase())};
}

const normSym=(src,s)=>{
 s=s.toUpperCase().replace(/[^A-Z0-9/._-]/g,'');
 if(src==='fx'&&!s.includes('/')&&s.length===6)s=s.slice(0,3)+'/'+s.slice(3);
 if(src==='gate'){
  s=s.replace('/', '_');
  if(!s.includes('_')){
   const m=/(USDT|USDC|USD|BTC|ETH)$/.exec(s);
   if(m)s=s.slice(0,m.index)+'_'+m[0];
   else s=s+'_USDT';
  }
 }
 if(src==='bn')s=s.replace(/[/_-]/g,'');
 return s;
};

// Symbol icon badge generator
function symBadge(sym,src){
 const clean=sym.replace(/[^A-Z0-9]/g,'');
 let bg='#2962ff',txt='◆';
 if(/BTC/.test(clean)){bg='#f7931a';txt='₿'}
 else if(/ETH/.test(clean)){bg='#627eea';txt='Ξ'}
 else if(/SOL/.test(clean)){bg='linear-gradient(135deg,#9945ff,#14f195)';txt='◎'}
 else if(/BNB/.test(clean)){bg='#f3ba2f';txt='◆'}
 else if(/XRP/.test(clean)){bg='#23292f';txt='✕'}
 else if(/DOGE/.test(clean)){bg='#c2a633';txt='Ð'}
 else if(/EUR/.test(clean)){bg='#003399';txt='€'}
 else if(/GBP/.test(clean)){bg='#7b2cbf';txt='£'}
 else if(/XAU|GOLD/.test(clean)){bg='#d4af37';txt='AU'}
 else{
  txt=clean.slice(0,2);
  bg='#374151';
 }
 return`<div class="sym-icon" style="background:${bg}">${txt}</div>`;
}

/* ---------- Data Fetching Engine ---------- */
function plan(){
 const p=tfParse(S.tf)||{min:60,label:'1h'};
 S.tf=p.label;tfmin=p.min;tfms=tfmin*6e4;
 const nat=S.src==='bn'?NB:S.src==='fx'?NF:NG;
 if(nat[tfmin])base=tfmin;
 else base=Object.keys(nat).map(Number).sort((a,b)=>b-a).find(b=>b<tfmin&&tfmin%b===0)||1;
 return nat[base];
}

async function fetchGate(sym,iv,pages,endT){
 let out=[],end=endT?Math.floor(endT/1000):'';
 for(let p=0;p<(pages||1);p++){
  const r=await fetch(`https://api.gateio.ws/api/v4/spot/candlesticks?currency_pair=${encodeURIComponent(sym)}&interval=${iv}&limit=1000${end?'&to='+end:''}`);
  const a=await r.json();
  if(!Array.isArray(a))throw Error((a&&a.message)||'Gate.io error');
  if(!a.length)break;
  const mapped=a.map(k=>({t:+k[0]*1000,o:+k[5],h:+k[3],l:+k[4],c:+k[2]}));
  out=mapped.concat(out);
  end=+a[0][0]-1;
  if(a.length<1000)break;
 }
 return out;
}

// Multi-mirror Binance fetcher
async function fetchBn(sym,iv,pages,endT){
 const cleanSym=sym.replace(/[/_-]/g,'');
 const mirrors=[
  'https://api.binance.com/api/v3/klines',
  'https://data-api.binance.vision/api/v3/klines',
  'https://api1.binance.com/api/v3/klines',
  'https://api2.binance.com/api/v3/klines',
  'https://api3.binance.com/api/v3/klines'
 ];
 let lastErr=null;
 for(const base of mirrors){
  try{
   let out=[],end=endT||Date.now()+1;
   for(let p=0;p<pages;p++){
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),4500);
    const r=await fetch(`${base}?symbol=${cleanSym}&interval=${iv}&limit=1000&endTime=${end}`,{signal:ctrl.signal});
    clearTimeout(tid);
    const a=await r.json();
    if(!Array.isArray(a))throw Error(a.msg||'Binance error');
    if(!a.length)break;
    out=a.map(k=>({t:k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4]})).concat(out);
    end=a[0][0]-1;
    if(a.length<1000)break;
   }
   if(out.length)return out;
  }catch(e){lastErr=e}
 }
 throw lastErr||Error('Binance unreachable. Your network may block binance domains; try Gate.io or VPN/DoH.');
}

async function fetchTd(sym,iv,size,endT){
 const k=cfg.key||'demo';
 const r=await fetch(`https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(sym)}&interval=${iv}&outputsize=${size}${endT?'&end_date='+encodeURIComponent(new Date(endT).toISOString().slice(0,19).replace('T',' ')):''}&order=asc&timezone=UTC&apikey=${k}`);
 const j=await r.json();
 if(j.status==='error'){
  if(!cfg.key)throw Error('Forex demo limit. Add free key in ⚙ Settings');
  throw Error(j.message);
 }
 return j.values.map(v=>{let s=v.datetime;s=s.length<11?s+'T00:00:00Z':s.replace(' ','T')+'Z';return{t:Date.parse(s),o:+v.open,h:+v.high,l:+v.low,c:+v.close}});
}

function upsert(b){
 const l=raw[raw.length-1];
 if(l&&l.t===b.t)raw[raw.length-1]=b;
 else if(!l||b.t>l.t)raw.push(b);
 if(!rb)rb=setTimeout(()=>{rb=0;rebuild();sched()},200);
}

function bucket(t,ms){
 const DY=864e5;
 if(tfmin>=43200){const n=Math.round(tfmin/43200),d=new Date(t),k=Math.floor((d.getUTCFullYear()*12+d.getUTCMonth())/n)*n;return Date.UTC(Math.floor(k/12),k%12,1)}
 if(tfmin>=10080&&tfmin%10080===0){const o=4*DY;return Math.floor((t-o)/ms)*ms+o}
 return Math.floor(t/ms)*ms;
}

function agg(a,ms){
 const o=[];
 for(const b of a){
  const t=bucket(b.t,ms),l=o[o.length-1];
  if(l&&l.t===t){l.h=Math.max(l.h,b.h);l.l=Math.min(l.l,b.l);l.c=b.c}
  else o.push({t,o:b.o,h:b.h,l:b.l,c:b.c});
 }
 return o;
}

function rebuild(){
 D=Dfull=base===tfmin?raw.map(b=>({...b})):agg(raw,tfms);
 if(cfg.gapFree)for(let i=1;i<D.length;i++){const b=D[i];b.o=D[i-1].c;b.h=Math.max(b.h,b.o);b.l=Math.min(b.l,b.o)}
 if(rp&&!rp.pick)rp.n=nFromT();
 applyView();
}

/* ---------- Fair Value Gap (FVG) Logic ---------- */
function applyView(){
 D=rp&&!rp.pick?Dfull.slice(0,rp.n):Dfull;
 const n=D.length,k=Math.min(14,n);
 let s=0;for(let i=n-k;i<n;i++)s+=D[i].h-D[i].l;
 atr=k?s/k:1;
 fvgs=[];
 for(let i=2;i<n;i++){
  const a=D[i-2],c=D[i];
  let up,top,bot;
  if(c.l>a.h){up=1;top=c.l;bot=a.h} // Bullish gap
  else if(c.h<a.l){up=0;top=a.l;bot=c.h} // Bearish gap
  else continue;
  if((top-bot)/c.c*100<cfg.fvgMin)continue;
  let end=-1;
  for(let j=i+1;j<n;j++){
   if(up?D[j].l<=bot:D[j].h>=top){end=j;break}
  }
  fvgs.push({s:i-1,e:end,up,top,bot});
 }
}

async function load(){
 const my=++loadId;
 if(ws){ws.onclose=null;ws.close();ws=null}
 clearInterval(poll);
 status('Loading…');
 const iv=plan();
 try{
  if(S.src==='bn'){
   raw=await fetchBn(S.sym,iv,base===tfmin?2:4);
  }else if(S.src==='gate'){
   raw=await fetchGate(S.sym,iv,base===tfmin?2:4);
  }else{
   raw=await fetchTd(S.sym,iv,5000);
  }
  if(my!==loadId)return;
  if(!raw.length)throw Error('No data for '+S.sym);
  rebuild();off=6;bw=8;status('');sched();live(my,iv);
 }catch(e){
  if(my===loadId){
   raw=[];D=[];status(e.message,1);sched();
  }
 }
}

function live(my,iv){
 if(S.src==='bn'){
  const cleanSym=S.sym.toLowerCase().replace(/[/_-]/g,'');
  const open=()=>{
   ws=new WebSocket(`wss://stream.binance.com:9443/ws/${cleanSym}@kline_${iv}`);
   ws.onmessage=e=>{const k=JSON.parse(e.data).k;if(k)upsert({t:k.t,o:+k.o,h:+k.h,l:+k.l,c:+k.c})};
   ws.onclose=()=>{if(my===loadId)setTimeout(()=>my===loadId&&open(),2500)};
   ws.onerror=()=>{try{ws.close()}catch{}};
  };open();
 }else if(S.src==='gate'){
  const open=()=>{
   ws=new WebSocket('wss://api.gateio.ws/ws/v4/');
   let ping=null;
   ws.onopen=()=>{
    ws.send(JSON.stringify({time:Math.floor(Date.now()/1000),channel:'spot.candlesticks',event:'subscribe',payload:[iv,S.sym]}));
    ping=setInterval(()=>{if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({time:Math.floor(Date.now()/1000),channel:'spot.ping'}))},20000);
   };
   ws.onmessage=e=>{
    try{const d=JSON.parse(e.data);if(d.event==='update'&&d.result){const k=d.result;upsert({t:+k.t*1000,o:+k.o,h:+k.h,l:+k.l,c:+k.c})}}catch{}
   };
   ws.onclose=()=>{clearInterval(ping);if(my===loadId)setTimeout(()=>my===loadId&&open(),2500)};
   ws.onerror=()=>{try{ws.close()}catch{}};
  };open();
 }else{
  poll=setInterval(async()=>{try{(await fetchTd(S.sym,iv,2)).forEach(upsert)}catch{}},20000);
 }
}

function setSym(src,sym,tf){
 S.src=src;S.sym=normSym(src,sym);
 if(tf)S.tf=tf;
 SV('S',S);
 $('src').value=S.src;$('sym').value=S.sym;

/* ---------- Drawing Engine & Interactive Manipulation ---------- */
function render(d,isSel){
 ctx.strokeStyle=ctx.fillStyle=d.color;ctx.lineWidth=d.w;ctx.setLineDash([]);
 const P=d.pts.map(q=>[X(q.t),Y(q.p)]);
 if(d.type==='hline'){
  ctx.beginPath();ctx.moveTo(0,P[0][1]);ctx.lineTo(pw,P[0][1]);ctx.stroke();
 }
 else if(d.type==='hray'){
  ctx.beginPath();ctx.moveTo(P[0][0],P[0][1]);ctx.lineTo(pw,P[0][1]);ctx.stroke();
 }
 else if(d.type==='vline'){
  ctx.beginPath();ctx.moveTo(P[0][0],0);ctx.lineTo(P[0][0],ph);ctx.stroke();
 }
 else if(d.type==='rect'){
  const[a,b]=P;ctx.globalAlpha=.15;ctx.fillRect(a[0],a[1],b[0]-a[0],b[1]-a[1]);ctx.globalAlpha=1;ctx.strokeRect(a[0],a[1],b[0]-a[0],b[1]-a[1]);
 }
 else if(d.s!=null){
  const lg=d.type==='long',[a,b]=P,x1=Math.min(a[0],b[0]),w=Math.abs(b[0]-a[0]),ye=a[1],ys=Y(d.s),yt=Y(d.tg),e=d.pts[0].p;
  ctx.fillStyle='rgba(38,166,154,.28)';ctx.fillRect(x1,Math.min(ye,yt),w,Math.abs(yt-ye));
  ctx.fillStyle='rgba(239,83,80,.28)';ctx.fillRect(x1,Math.min(ye,ys),w,Math.abs(ys-ye));
  ctx.strokeStyle='#9aa3b2';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x1,ye);ctx.lineTo(x1+w,ye);ctx.stroke();
  const sg=lg?1:-1,tp=(d.tg-e)/e*100*sg,sp=(d.s-e)/e*100*sg,rr=Math.abs(d.tg-e)/(Math.abs(e-d.s)||1e-12),cx=x1+w/2;
  ctx.font='11px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';
  ctx.fillText(`Target ${fmt(d.tg)} (${tp>=0?'+':''}${tp.toFixed(2)}%)`,cx,yt+(yt<ye?13:-5));
  ctx.fillText(`Stop ${fmt(d.s)} (${sp>=0?'+':''}${sp.toFixed(2)}%)`,cx,ys+(ys<ye?13:-5));
  ctx.fillText(`${lg?'Long':'Short'} · R:R ${rr.toFixed(2)}`,cx,ye-4);ctx.textAlign='left';
 }
 else{
  ctx.beginPath();P.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();
 }
 
 // Selection handles (circles for editing vertices)
 if(isSel){
  for(const h of handles(d)){
   ctx.beginPath();ctx.arc(h.x,h.y,HR*.6,0,7);ctx.fillStyle='#fff';ctx.fill();
   ctx.strokeStyle='#2962ff';ctx.lineWidth=2;ctx.stroke();
  }
 }
}

function handles(d){
 const P=d.pts.map(q=>[X(q.t),Y(q.p)]),H=P.map((p,i)=>({x:p[0],y:p[1],k:i}));
 if(d.type==='hline')H[0].x=pw/2;
 if(d.type==='vline')H[0].y=ph/2;
 if(d.s!=null){
  const mx=(P[0][0]+P[1][0])/2;
  H.push({x:mx,y:Y(d.s),k:'s'},{x:mx,y:Y(d.tg),k:'tg'});
 }
 return H;
}

const segD=(px,py,x1,y1,x2,y2)=>{const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy;let t=l?((px-x1)*dx+(py-y1)*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-x1-t*dx,py-y1-t*dy)};

function hit(x,y){
 for(let k=drs.length;k--;){
  const d=drs[k],P=d.pts.map(q=>[X(q.t),Y(q.p)]);
  let ok=false;
  if(d.type==='hline')ok=Math.abs(y-P[0][1])<TH;
  else if(d.type==='hray')ok=x>=P[0][0]-TH&&Math.abs(y-P[0][1])<TH;
  else if(d.type==='vline')ok=Math.abs(x-P[0][0])<TH;
  else if(d.type==='rect'){const[a,b]=P;ok=x>=Math.min(a[0],b[0])-4&&x<=Math.max(a[0],b[0])+4&&y>=Math.min(a[1],b[1])-4&&y<=Math.max(a[1],b[1])+4}
  else if(d.s!=null){const ys=[P[0][1],Y(d.s),Y(d.tg)];ok=x>=Math.min(P[0][0],P[1][0])&&x<=Math.max(P[0][0],P[1][0])&&y>=Math.min(...ys)&&y<=Math.max(...ys)}
  else for(let i=0;i<P.length-1;i++)if(segD(x,y,...P[i],...P[i+1])<TH){ok=true;break}
  if(ok)return d;
 }
}

const saveDr=()=>SV('dr:'+S.src+S.sym,drs);
const snap=()=>{hist.push(JSON.stringify(drs));if(hist.length>100)hist.shift();redoS=[]};
function undo(){if(!hist.length)return;redoS.push(JSON.stringify(drs));drs=JSON.parse(hist.pop());sel=null;draft=null;saveDr();sched()}
function redo(){if(!redoS.length)return;hist.push(JSON.stringify(drs));drs=JSON.parse(redoS.pop());sel=null;draft=null;saveDr();sched()}
function commit(d){snap();d.id=Date.now()+Math.random();drs.push(d);sel=d;draft=null;setTool('cursor');saveDr();sched()}
function finishPoly(){
 if(!draft||draft.type!=='poly')return;
 const p=draft.pts;p.pop();
 while(p.length>1){
  const a=p[p.length-1],b=p[p.length-2];
  if(Math.hypot(X(a.t)-X(b.t),Y(a.p)-Y(b.p))<4)p.pop();else break;
 }
 if(p.length>=2)commit(draft);else{draft=null;sched()}
}

/* ---------- Replay ---------- */
function startRp(){if(rp){exitRp();return}rp={T:D[Math.max(0,D.length-60)].t,speed:+$('rsp').value||5,play:0,n:0};
 $('rp').hidden=false;$('rpbtn').textContent='Exit replay';rebuild();sched()}
function exitRp(){rp=null;clearInterval(playT);playT=0;$('rp').hidden=true;$('rpbtn').textContent='⏪ Replay';rebuild();sched()}
function step(dir){if(!rp)return;let n=rp.n+dir;n=Math.max(1,Math.min(Dfull.length,n));rp.n=n;rp.T=Dfull[n-1].t;applyView();sched()}
function setPlay(p){if(!rp)return;rp.play=p;$('rpl').textContent=p?'⏸':'▶';clearInterval(playT);playT=0;
 if(p){const ms=Math.max(20,1000/(rp.speed||5));playT=setInterval(()=>{if(!rp||!rp.play)return;if(rp.n>=Dfull.length){setPlay(0);return}step(1)},ms)}}
function togglePlay(){if(rp)setPlay(rp.play?0:1)}

/* ---------- Main Chart Rendering ---------- */
function draw(){
 raf=0;if(!W||!H)return;ctx.fillStyle=cfg.bg;ctx.fillRect(0,0,W,H);
 if(!D.length){ctx.fillStyle='#888';ctx.font='14px system-ui';ctx.textAlign='center';ctx.fillText('No data available',W/2,H/2);ctx.textAlign='left';return}
 const n=D.length,i0=Math.max(0,Math.floor(idxAt(0))),i1=Math.min(n-1,Math.ceil(idxAt(pw)));
 let l=Infinity,h=-Infinity;
 for(let i=i0;i<=i1;i++){const b=D[i];if(b.l<l)l=b.l;if(b.h>h)h=b.h}
 if(!isFinite(l)||l===h){l=D[n-1].c*.99;h=D[n-1].c*1.01}
 const pad=(h-l)*.06;lo=l-pad;hi=h+pad;

 // Grid lines
 ctx.strokeStyle=cfg.grid;ctx.lineWidth=1;ctx.beginPath();
 const yStep=nice(hi-lo,Math.max(3,ph/60));
 for(let p=Math.ceil(lo/yStep)*yStep;p<=hi;p+=yStep){const y=Math.round(Y(p))+.5;ctx.moveTo(0,y);ctx.lineTo(pw,y)}
 const tStep=nice((xAt(i1)-xAt(i0))/bw*tfmin,Math.max(3,pw/100));
 for(let i=i0;i<=i1;i++){
  const b=D[i];
  if(Math.floor(b.t/6e4/tStep)!==Math.floor((i?D[i-1].t:0)/6e4/tStep)){
   const x=Math.round(xAt(i))+.5;ctx.moveTo(x,0);ctx.lineTo(x,ph);
  }
 }
 ctx.stroke();

 // Fair Value Gaps (FVG) - Restored and verified
 if(cfg.fvgOn){
  const list=[...fvgs.filter(f=>f.e<0).slice(-cfg.fvgMax)];
  if(cfg.fvgMit)list.push(...fvgs.filter(f=>f.e>=0).slice(-cfg.fvgMax));
  for(const f of list){
   const x1=Math.max(0,xAt(f.s)-bw/2);
   const x2=f.e<0?pw:Math.min(pw,xAt(f.e));
   const y1=yAt(f.top),y2=yAt(f.bot);
   const boxH=Math.abs(y2-y1),topY=Math.min(y1,y2);
   if(x2<0||x1>pw)continue;
   ctx.fillStyle=rgba(f.up?cfg.fvgUp:cfg.fvgDn,f.e<0?cfg.fvgOp:cfg.fvgOp*.4);
   ctx.fillRect(x1,topY,x2-x1,boxH);
   ctx.strokeStyle=f.up?cfg.fvgUp:cfg.fvgDn;
   ctx.lineWidth=1;
   ctx.strokeRect(x1,topY,x2-x1,boxH);
  }
 }

 // Candlesticks
 const bwC=Math.max(1,bw*.7),half=bwC/2;
 for(let i=i0;i<=i1;i++){
  const b=D[i],x=xAt(i),up=b.c>=b.o,yo=Y(b.o),yc=Y(b.c),yh=Y(b.h),yl=Y(b.l);
  ctx.strokeStyle=up?cfg.wickUp:cfg.wickDn;ctx.beginPath();ctx.moveTo(Math.round(x)+.5,yh);ctx.lineTo(Math.round(x)+.5,yl);ctx.stroke();
  ctx.fillStyle=up?cfg.up:cfg.dn;const top=Math.min(yo,yc),bh=Math.max(1,Math.abs(yo-yc));
  ctx.fillRect(x-half,top,bwC,bh);ctx.strokeRect(x-half,top,bwC,bh);
 }

 // Render committed and draft drawings
 drs.forEach(d=>render(d,d===sel));
 if(draft)render(draft,false);

 // Axes backgrounds
 ctx.fillStyle='#151a23';ctx.fillRect(pw,0,AX,H);ctx.fillRect(0,ph,W,AY);
 ctx.strokeStyle='#232a36';ctx.beginPath();ctx.moveTo(pw+.5,0);ctx.lineTo(pw+.5,ph);ctx.moveTo(0,ph+.5);ctx.lineTo(pw,ph+.5);ctx.stroke();

 // Price axis labels
 ctx.fillStyle='#9aa3b2';ctx.font='11px system-ui';ctx.textAlign='left';
 for(let p=Math.ceil(lo/yStep)*yStep;p<=hi;p+=yStep){ctx.fillText(fmt(p),pw+5,Y(p)+4)}

 // Time axis labels
 ctx.textAlign='center';
 for(let i=i0;i<=i1;i++){
  const b=D[i];
  if(Math.floor(b.t/6e4/tStep)!==Math.floor((i?D[i-1].t:0)/6e4/tStep)){
   const d=new Date(b.t),s=tfmin>=1440?d.toLocaleDateString(undefined,{month:'short',day:'numeric'}):d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
   ctx.fillText(s,xAt(i),ph+16);
  }
 }

 // Crosshair & Magnet Indicator
 if(m&&m.x<pw&&m.y<ph){
  let cx=m.x,cy=m.y;
  if(magnetOn){
   const sn=getSnapped(m.x,m.y);
   if(sn.snapped){
    cx=sn.x;cy=sn.y;
    // Draw snap magnet target
    ctx.beginPath();ctx.arc(cx,cy,5,0,7);ctx.strokeStyle='#00e676';ctx.lineWidth=2;ctx.stroke();
   }
  }
  ctx.strokeStyle='#4a5568';ctx.setLineDash([4,4]);ctx.beginPath();
  ctx.moveTo(0,cy+.5);ctx.lineTo(pw,cy+.5);ctx.moveTo(cx+.5,0);ctx.lineTo(cx+.5,ph);ctx.stroke();ctx.setLineDash([]);
  const p=pAt(cy);ctx.fillStyle='#2962ff';ctx.fillRect(pw,cy-10,AX,20);ctx.fillStyle='#fff';ctx.textAlign='left';ctx.fillText(fmt(p),pw+5,cy+4);
  const curI=Math.round(idxAt(cx));
  if(curI>=0&&curI<n){
   const b=D[curI],d=new Date(b.t),s=d.toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
   ctx.fillRect(cx-45,ph,90,18);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(s,cx,ph+13);
   $('ohlc').innerHTML=`<span style="color:#fff;font-weight:600">${S.sym} · ${S.tf}</span> O:${fmt(b.o)} H:${fmt(b.h)} L:${fmt(b.l)} C:${fmt(b.c)} <span style="color:${b.c>=b.o?'#26a69a':'#ef5350'}">${((b.c-b.o)/b.o*100).toFixed(2)}%</span>`;
  }
 }

 // Last price tag on axis
 const curB=D[n-1];
 if(curB){
  const y=Y(curB.c);ctx.fillStyle=curB.c>=curB.o?'#26a69a':'#ef5350';ctx.fillRect(pw,y-10,AX,20);ctx.fillStyle='#fff';ctx.textAlign='left';ctx.fillText(fmt(curB.c),pw+5,y+4);
 }
}

/* ---------- Pointer Interaction & Drawing Manipulation ---------- */
const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};

cv.onpointerdown=e=>{
 cv.setPointerCapture(e.pointerId);
 const[x,y]=pos(e);m={x,y};ptrs.set(e.pointerId,[x,y]);
 if(ptrs.size===2){
  const[a,b]=[...ptrs.values()];
  pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,bw:bw,idx:idxAt((a[0]+b[0])/2)};
  drag=null;draft=null;return;
 }
 if(!D.length||x>pw||y>ph)return;
 down={x,y};

 if(rp&&rp.pick){
  const i=Math.max(0,Math.min(D.length-1,Math.round(idxAt(x))));
  rp.n=i+1;rp.T=endT(i);rp.pick=false;status('');applyView();sched();return;
 }

 // Drawing creation
 if(tool!=='cursor'){
  const p=pt(x,y);
  if(tool==='hline'||tool==='vline'||tool==='hray'){
   commit({type:tool,pts:[p],w:dw,color:dcol});
  }else if(tool==='long'||tool==='short'){
   const lg=tool==='long',r=atr*1.5;
   commit({type:tool,pts:[p,{t:tOf(idxAt(x)+25),p:p.p}],s:lg?p.p-r:p.p+r,tg:lg?p.p+2*r:p.p-2*r,w:dw,color:dcol});
  }else if(tool==='poly'){
   if(!draft)draft={type:'poly',pts:[p,{...p}],w:dw,color:dcol};
   else{draft.pts[draft.pts.length-1]=p;draft.pts.push({...p})};
  }else{
   if(!draft)draft={type:tool,pts:[p,{...p}],w:dw,color:dcol,sx:x,sy:y};
   else{draft.pts[1]=p;commit(draft)};
  }
  sched();return;
 }

 // Check for clicking handles of selected drawing (Modify existing drawings)
 const hd=sel&&handles(sel).find(h=>Math.hypot(h.x-x,h.y-y)<HR);
 if(hd){
  drag={type:'h',k:hd.k};
  return;
 }

 // Check for clicking body of existing drawing to select and move it
 const h=hit(x,y);
 if(h){
  sel=h;
  drag={type:'move',i0:idxAt(x),p0:pAt(y),orig:JSON.parse(JSON.stringify(h))};
  $('w').value=h.w;$('col').value=h.color;
 }else{
  sel=null;drag={type:'pan',off};
 }
 sched();
};

cv.onpointermove=e=>{
 const[x,y]=pos(e);m={x,y};
 if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,[x,y]);
 if(pinch&&ptrs.size===2){
  const[a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1])||1,mx=(a[0]+b[0])/2;
  bw=Math.max(1.5,Math.min(60,pinch.bw*d/pinch.d));
  off=pinch.idx-(mx-pw)/bw-(D.length-1);
  sched();return;
 }

 if(draft){
  let targetX=x,targetY=y;
  // Angle snapping for trendlines (TradingView horizontal locking)
  if((angleSnapOn||e.shiftKey)&&draft.type==='trend'&&draft.sx!=null){
   const dx=x-draft.sx,dy=y-draft.sy;
   const deg=Math.atan2(dy,dx)*180/Math.PI;
   if(Math.abs(deg)<22.5||Math.abs(deg)>157.5){targetY=draft.sy} // Snap pure horizontal
   else if(Math.abs(Math.abs(deg)-45)<15){targetY=draft.sy+Math.sign(dy)*Math.abs(dx)} // Snap 45 degrees
   else if(Math.abs(Math.abs(deg)-90)<15){targetX=draft.sx} // Snap pure vertical
  }
  draft.pts[draft.pts.length-1]=pt(targetX,targetY);
 }

 // Dragging a handle to modify drawing vertices
 if(drag&&sel&&drag.type==='h'){
  if(!drag.s){snap();drag.s=1}
  const sn=magnetOn?getSnapped(x,y):{p:pAt(y),t:tOf(idxAt(x))};
  const k=drag.k,t=sn.t,p=sn.p;
  if(k==='s')sel.s=p;
  else if(k==='tg')sel.tg=p;
  else if(sel.s!=null&&k===1){sel.pts[1]={t,p:sel.pts[0].p}}
  else if(sel.s!=null&&k===0){sel.pts[0]={t,p};sel.pts[1].p=p}
  else sel.pts[k]={t,p};
 }
 // Dragging the whole drawing
 else if(drag&&drag.type==='move'){
  if(!drag.s){snap();drag.s=1}
  const di=idxAt(x)-drag.i0,dp=pAt(y)-drag.p0;
  sel.pts=drag.orig.pts.map(q=>({t:tOf(idxOf(q.t)+di),p:q.p+dp}));
  if(sel.s!=null){sel.s=drag.orig.s+dp;sel.tg=drag.orig.tg+dp}
 }
 else if(drag&&drag.type==='pan'){
  off=Math.max(-(D.length-5),Math.min(300,drag.off-(x-down.x)/bw));
 }
 sched();
};

cv.onpointerup=e=>{
 ptrs.delete(e.pointerId);
 if(ptrs.size<2)pinch=null;
 if(draft&&draft.sx!=null){
  const[x,y]=pos(e);
  if(Math.hypot(x-draft.sx,y-draft.sy)>6){
   draft.pts[1]=pt(x,y);commit(draft);
  }
 }
 if(drag&&drag.type!=='pan')saveDr();
 drag=null;
};

cv.onmouseleave=()=>{m=null;$('ohlc').innerHTML='';sched()};
cv.ondblclick=()=>finishPoly();

cv.addEventListener('wheel',e=>{
 e.preventDefault();if(!D.length)return;
 const[x]=pos(e),idx=idxAt(x);
 bw=Math.max(1.5,Math.min(60,bw*Math.exp(-e.deltaY*.0012)));
 off=idx-(x-pw)/bw-(D.length-1);
 sched();
},{passive:false});

addEventListener('keydown',e=>{
 if(/INPUT|SELECT/.test(document.activeElement.tagName))return;
 const mod=e.ctrlKey||e.metaKey;
 if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
 if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return}
 if(rp&&!rp.pick){
  if(e.key==='ArrowRight'){setPlay(0);step(1);return}
  if(e.key==='ArrowLeft'){setPlay(0);step(-1);return}
  if(e.key===' '){e.preventDefault();togglePlay();return}
 }
 if(e.key==='Escape'){draft=null;setTool('cursor');sel=null;sched()}

/* ---------- Watchlist Panel & Price Feeds ---------- */
function wlRender(){
 $('wsel').innerHTML=Object.keys(wls).map(k=>`<option ${k===wcur?'selected':''}>${k}</option>`).join('');
 const list=wls[wcur]||[];
 $('wi').innerHTML=list.map((x,i)=>{
  const isActive=(x.src===S.src&&normSym(x.src,x.sym)===normSym(S.src,S.sym));
  return `
  <div class="wi ${isActive?'active':''}" data-i="${i}">
   ${symBadge(x.sym,x.src)}
   <div class="sym-info">
    <div class="sym-name">${x.sym}</div>
    <div class="sym-src">${x.src==='gate'?'Gate.io':x.src==='bn'?'Binance':'Forex'}</div>
   </div>
   <div class="sym-price" id="wp${i}">
    <span class="p-val">--</span>
   </div>
   <span class="del-btn" data-d="${i}" title="Remove from watchlist">✕</span>
  </div>
  `;
 }).join('');
 wlPrices();
}

async function wlPrices(){
 const L=wls[wcur]||[];
 // Gate.io symbols
 const gIdx=L.map((x,i)=>x.src==='gate'?i:-1).filter(i=>i>=0);
 for(const i of gIdx){
  try{
   const r=await fetch(`https://api.gateio.ws/api/v4/spot/tickers?currency_pair=${encodeURIComponent(L[i].sym)}`);
   const arr=await r.json();
   if(Array.isArray(arr)&&arr.length&&$('wp'+i)){
    const t=arr[0],c=+t.change_percentage;
    $('wp'+i).innerHTML=`<span class="p-val">${fmt(+t.last)}</span><span class="p-chg ${c>=0?'up':'dn'}">${c>=0?'+':''}${c.toFixed(2)}%</span>`;
   }
  }catch{}
 }
 // Binance symbols
 const bIdx=L.map((x,i)=>x.src==='bn'?i:-1).filter(i=>i>=0);
 if(bIdx.length){
  try{
   const r=await fetch('https://api.binance.com/api/v3/ticker/24hr?symbols='+encodeURIComponent(JSON.stringify(bIdx.map(i=>normSym('bn',L[i].sym)))));
   const a=await r.json();
   if(Array.isArray(a)){
    a.forEach(t=>{
     bIdx.forEach(i=>{
      if(normSym('bn',L[i].sym)===t.symbol&&$('wp'+i)){
       const c=+t.priceChangePercent;
       $('wp'+i).innerHTML=`<span class="p-val">${fmt(+t.lastPrice)}</span><span class="p-chg ${c>=0?'up':'dn'}">${c>=0?'+':''}${c.toFixed(2)}%</span>`;
      }
     });
    });
   }
  }catch{}
 }
}

 }

 }
};

async function loadMore(){
 if(!raw.length)return;
 status('Loading older bars…');
 try{
  const e=raw[0].t-1;let a=[];
  if(S.src==='bn')a=await fetchBn(S.sym,NB[base],4,e);
  else if(S.src==='gate')a=await fetchGate(S.sym,NG[base]||'1h',4,e);
  else a=await fetchTd(S.sym,NF[base],5000,e);
  const have=new Set(raw.map(b=>b.t)),add=a.filter(b=>!have.has(b.t));
  if(!add.length){status('No older data available');setTimeout(()=>status(''),2500);return}
  raw=add.concat(raw);rebuild();status('');sched();
 }catch(err){status(err.message,1)}
}

 pw=W-AX;ph=H-AY;sched();
}

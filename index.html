<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MyCharts - Pro Trading Platform</title>
<meta name="theme-color" content="#0e1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;background:#0e1117;color:#c9ced8;font:13px system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;user-select:none}
#app{display:grid;grid-template-columns:48px 1fr 240px;grid-template-rows:42px 1fr;height:100%;width:100%;transition:grid-template-columns .2s ease}
#app.wl-collapsed{grid-template-columns:48px 1fr 0px}

/* Top Navigation Bar */
#top{grid-column:1/4;display:flex;align-items:center;gap:6px;padding:0 8px;background:#151a23;border-bottom:1px solid #232a36;overflow-x:auto;white-space:nowrap;z-index:10}
#brand{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;letter-spacing:-0.2px;padding-right:10px;border-right:1px solid #232a36;flex-shrink:0;cursor:pointer}
#brand svg{flex-shrink:0}

/* Symbol Button with search badge */
#sym-btn{display:flex;align-items:center;gap:6px;font-weight:600;padding:4px 10px;background:#1d2430;border:1px solid #2a3342;border-radius:6px;cursor:pointer}
#sym-btn:hover{background:#273042;border-color:#2962ff}

/* Symbol Search Modal (Fixed Overlay - Never Clipped) */
#search-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-start;justify-content:center;padding-top:70px;z-index:999;backdrop-filter:blur(5px)}
#search-modal[hidden]{display:none}
#search-box{background:#151a23;border:1px solid #2a3342;border-radius:10px;width:min(520px,94vw);max-height:80vh;box-shadow:0 16px 48px rgba(0,0,0,.8);display:flex;flex-direction:column;overflow:hidden}
#search-header{padding:10px;border-bottom:1px solid #232a36;background:#181e28;display:flex;gap:8px;align-items:center}
#search-input{flex:1;padding:8px 12px;font-size:13px;background:#11151c;border:1px solid #2a3342;border-radius:6px;color:#fff;outline:none}
#search-input:focus{border-color:#2962ff}
#search-brokers{display:flex;gap:4px;padding:6px 10px;border-bottom:1px solid #232a36;background:#131822;overflow-x:auto}
.sbrk{padding:3px 8px;font-size:10px;font-weight:600;border-radius:4px;cursor:pointer;background:#181e28;border:1px solid #283344;color:#9aa3b2;white-space:nowrap}
.sbrk:hover{background:#232a36;color:#fff}
.sbrk.on{background:#2962ff;border-color:#2962ff;color:#fff}
#search-tabs{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid #232a36;background:#131822}
.stab{padding:4px 10px;font-size:11px;font-weight:600;border-radius:4px;cursor:pointer;background:transparent;border:none;color:#9aa3b2}
.stab.on{background:#2962ff;color:#fff}
#search-results{flex:1;overflow-y:auto;display:flex;flex-direction:column;max-height:340px}
.s-item{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;border-bottom:1px solid #1a202c;transition:background .15s}
.s-item:hover{background:#1d2430}
.s-item .s-sym{font-weight:600;color:#fff;font-size:13px}
.s-item .s-desc{font-size:11px;color:#8a919e;flex:1}
.s-item .s-tag{font-size:10px;padding:2px 6px;border-radius:3px;background:#232a36;color:#9aa3b2;text-transform:uppercase}

/* Left Tools Toolbar (TradingView style) */
#tools{background:#151a23;border-right:1px solid #232a36;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;overflow-y:auto;z-index:5}
#tools button,#tools .tool-btn{width:36px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid transparent;background:transparent;color:#9aa3b2;cursor:pointer;transition:all .15s ease}
#tools button:hover{background:#1d2430;color:#fff}
#tools button.on{background:#2962ff;border-color:#2962ff;color:#fff;box-shadow:0 0 10px rgba(41,98,255,.45)}
#tools .sep{width:26px;height:1px;background:#232a36;margin:3px 0}
#tools select{width:38px;padding:2px;font-size:11px}
#tools input[type=color]{width:32px;height:22px;padding:0;border:none;border-radius:4px;cursor:pointer}

/* Center chart canvas */
#cw{position:relative;width:100%;height:100%;overflow:hidden;background:#0e1117}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;cursor:crosshair;touch-action:none;image-rendering:-webkit-optimize-contrast;image-rendering:crisp-edges}
#ohlc{position:absolute;left:10px;top:8px;font-size:12px;pointer-events:none;color:#9aa3b2;display:flex;gap:8px;align-items:center;background:rgba(21,26,35,.8);padding:3px 8px;border-radius:4px;backdrop-filter:blur(4px);z-index:2}

/* Floating Drawing Action Menu */
#dr-menu{position:absolute;display:flex;gap:4px;align-items:center;background:#151a23;border:1px solid #2a3342;border-radius:6px;padding:3px 6px;box-shadow:0 6px 18px rgba(0,0,0,.6);z-index:20}
#dr-menu[hidden]{display:none}
#dr-menu button{font-size:11px;padding:4px 8px;border-radius:4px;display:flex;align-items:center;gap:4px;background:#1d2430;border:1px solid #273042;color:#c9ced8;cursor:pointer}
#dr-menu button:hover{background:#273042;color:#fff}

/* Alerts List Modal */
#alerts-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:999;backdrop-filter:blur(5px)}
#alerts-modal[hidden]{display:none}
#alerts-box{background:#151a23;border:1px solid #2a3342;border-radius:10px;width:min(440px,94vw);max-height:80vh;box-shadow:0 16px 48px rgba(0,0,0,.8);display:flex;flex-direction:column;overflow:hidden}
#alerts-head{padding:12px 16px;border-bottom:1px solid #232a36;background:#181e28;display:flex;justify-content:space-between;align-items:center}
#alerts-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;padding:8px}
.alert-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;border-bottom:1px solid #1a202c}
.alert-row .a-sym{font-weight:600;color:#fff}
.alert-row .a-price{font-weight:600;color:#2962ff}
.alert-row .a-note{font-size:11px;color:#8a919e;flex:1}

/* Create Alert Modal */
#create-alert-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(5px)}
#create-alert-modal[hidden]{display:none}
#create-alert-box{background:#151a23;border:1px solid #2a3342;border-radius:10px;width:min(380px,94vw);padding:18px;box-shadow:0 16px 48px rgba(0,0,0,.8);display:flex;flex-direction:column}

/* Right Watchlist Panel */
#wl{background:#151a23;border-left:1px solid #232a36;display:flex;flex-direction:column;height:100%;overflow:hidden;z-index:5}
#wl-head{display:flex;align-items:center;gap:6px;padding:8px;border-bottom:1px solid #232a36;background:#181e28}
#wl-head span{font-weight:600;font-size:12px;color:#fff;flex:1}
#wi{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:1px;padding:4px}
.wi{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;cursor:pointer;transition:background .15s ease;font-size:12px}
.wi:hover{background:#1d2430}
.wi.active{background:#1e2738;border:1px solid #2962ff}
.sym-icon{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;color:#fff;flex-shrink:0}
.wi .sym-info{display:flex;flex-direction:column;flex:1;min-width:0}
.wi .sym-name{font-weight:600;color:#e1e5ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wi .sym-src{font-size:10px;color:#6b7280;text-transform:uppercase}
.wi .sym-price{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.wi .p-val{font-weight:600;color:#fff;font-size:12px}
.wi .p-chg{font-size:10px;font-weight:600;padding:1px 4px;border-radius:3px}
.wi .p-chg.up{background:rgba(38,166,154,.18);color:#26a69a}
.wi .p-chg.dn{background:rgba(239,83,80,.18);color:#ef5350}
.wi .del-btn{color:#556;font-size:13px;padding:2px 4px;border-radius:3px;opacity:0;transition:opacity .15s ease}
.wi:hover .del-btn{opacity:1}
.wi .del-btn:hover{color:#ef5350;background:rgba(239,83,80,.1)}
#wl-foot{padding:8px;border-top:1px solid #232a36;background:#151a23}
#wadd{width:100%;font-size:11px;padding:6px;display:flex;align-items:center;justify-content:center;gap:4px}

/* Common form elements */
button,select,input{font:inherit;color:inherit;background:#1d2430;border:1px solid #2a3342;border-radius:5px;padding:4px 8px}
button{cursor:pointer}button:hover{background:#273042}
button.on{background:#2962ff;border-color:#2962ff;color:#fff}
#st{margin-left:auto;font-size:12px;color:#f0b429;display:flex;align-items:center;gap:6px}

/* Settings modal */
#set{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:99;backdrop-filter:blur(3px)}
#set[hidden]{display:none}
#set>div{background:#151a23;border:1px solid #2a3342;border-radius:8px;padding:18px;width:min(420px,94vw);max-height:90vh;overflow:auto;box-shadow:0 12px 36px rgba(0,0,0,.6)}
#set label{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:12px}
#set input[type=color]{width:50px;height:26px;padding:0}
#set p{font-size:12px;color:#8a919e;margin-top:12px;line-height:1.4}

/* Bar replay float */
#rp{position:absolute;left:50%;transform:translateX(-50%);bottom:30px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;justify-content:center;background:rgba(21,26,35,.94);border:1px solid #2a3342;border-radius:8px;padding:6px 10px;max-width:96%;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.45);z-index:20}
#rp[hidden]{display:none}

/* Mobile responsive */
@media(max-width:700px){
#app{grid-template-columns:1fr;grid-template-rows:40px 1fr 48px}
#app.wl-collapsed{grid-template-columns:1fr}
#top{grid-column:1}#cw{grid-row:2}
#brand span{display:none}
#tools{grid-row:3;flex-direction:row;border-right:0;border-top:1px solid #232a36;padding:4px 6px calc(4px + env(safe-area-inset-bottom));overflow-x:auto;overflow-y:hidden;justify-content:flex-start}
#tools button{flex:none;width:40px;height:36px}#tools select,#tools input[type=color]{flex:none}
#tools .sep{width:1px;height:24px;margin:0 4px}
#wl{display:none;position:fixed;left:0;right:0;bottom:48px;max-height:60vh;border-top:1px solid #2a3342;z-index:90;box-shadow:0 -6px 20px rgba(0,0,0,.5)}
#wl.open{display:flex}
}
</style></head><body>

/* ---------- Helpers & Formatters ---------- */
const fmt=p=>p>=1000?p.toFixed(2):p>=100?p.toFixed(3):p>=1?p.toFixed(5):p.toFixed(6);
const rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`};
const nice=(r,t)=>{const s=r/t,p=10**Math.floor(Math.log10(s)),f=s/p;return(f<1.5?1:f<3?2:f<7?5:10)*p};

const idxAt=x=>(x-pw)/bw+D.length-1+off, xAt=i=>pw-(D.length-1+off-i)*bw;
const yAt=p=>(hi-p)/(hi-lo)*ph, pAt=y=>hi-y/ph*(hi-lo);

function idxOf(t){
 const n=D.length;
 if(t>=D[n-1].t)return n-1+(t-D[n-1].t)/tfms;
 if(t<=D[0].t)return(t-D[0].t)/tfms;
 let a=0,b=n-1;
 while(b-a>1){const k=(a+b)>>1;D[k].t<=t?a=k:b=k}
 return a+(t-D[a].t)/(D[b].t-D[a].t);
}
function tOf(i){
 const n=D.length;
 if(i>=n-1)return D[n-1].t+(i-n+1)*tfms;
 if(i<=0)return D[0].t+i*tfms;
 const a=Math.floor(i);
 return D[a].t+(i-a)*(D[a+1].t-D[a].t);
}
const X=t=>xAt(idxOf(t)),Y=p=>yAt(p);

// Magnet Snap detection
function getSnapped(x,y){
 if(!magnetOn||!D.length)return{x,y,p:pAt(y),t:tOf(idxAt(x)),snapped:false};
 const curI=Math.round(idxAt(x));
 const i=Math.max(0,Math.min(D.length-1,curI));
 const b=D[i],curP=pAt(y);
 const levels=[b.o,b.h,b.l,b.c];
 let bestP=levels[0],minD=Math.abs(levels[0]-curP);
 for(let k=1;k<levels.length;k++){
  const d=Math.abs(levels[k]-curP);
  if(d<minD){minD=d;bestP=levels[k]}
 }
 const snapPxY=yAt(bestP);
 const snapPxX=xAt(i);
 if(Math.hypot(x-snapPxX,y-snapPxY)<38){
  return{x:snapPxX,y:snapPxY,p:bestP,t:b.t,snapped:true};
 }
 return{x,y,p:curP,t:tOf(idxAt(x)),snapped:false};
}

const pt=(x,y)=>{
 const sn=getSnapped(x,y);
 return{t:sn.t,p:sn.p};
};

function tfParse(s){
 const r=/^(\d+)([mMhHdDwW])$/.exec(s.trim());if(!r)return null;
 const n=+r[1],u=r[2];if(!n)return null;
 const mult=u==='m'?1:u==='M'?43200:/[hH]/.test(u)?60:/[dD]/.test(u)?1440:10080;
 return{min:n*mult,label:n+(u==='m'||u==='M'?u:u.toLowerCase())};
}

/* ---------- Audio Chime Synthesizer (Web Audio API) ---------- */
function playChime(){
 try{
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtx)return;
  const actx=new AudioCtx();
  const o1=actx.createOscillator(),o2=actx.createOscillator(),g=actx.createGain();
  o1.type='sine';o1.frequency.setValueAtTime(587.33,actx.currentTime); // D5
  o2.type='sine';o2.frequency.setValueAtTime(880,actx.currentTime+0.1); // A5
  g.gain.setValueAtTime(0.2,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.6);
  o1.connect(g);o2.connect(g);g.connect(actx.destination);
  o1.start();o2.start(actx.currentTime+0.1);
  o1.stop(actx.currentTime+0.6);o2.stop(actx.currentTime+0.6);
 }catch{}
}

function plan(){
 const p=tfParse(S.tf)||{min:60,label:'1h'};
 S.tf=p.label;tfmin=p.min;tfms=tfmin*6e4;
 const nat=S.src==='bn'?NB:S.src==='fx'?NF:S.src==='fh'?NFh:NG;
 if(nat[tfmin])base=tfmin;
 else base=Object.keys(nat).map(Number).sort((a,b)=>b-a).find(b=>b<tfmin&&tfmin%b===0)||1;
 return nat[base];
}

async function fetchBn(sym,iv,pages,endT){

  'https://data-api.binance.vision/api/v3/klines',
  'https://api.binance.com/api/v3/klines',

 for(const base of mirrors){
  try{
   let out=[],end=endT||Date.now()+1;

    const tid=setTimeout(()=>ctrl.abort(),3500);

    end=a[0][0]-1;
    if(a.length<1000)break;

   if(out.length)return out;
  }catch(e){lastErr=e}
 }
 throw lastErr||Error('Binance unreachable. Enable VPN/Secure DNS or select Gate.io');
}

function checkAlerts(b){
 if(!alerts.length)return;
 const curSym=normSym(S.src,S.sym);
 const prevB=D.length>1?D[D.length-2]:null;

 alerts.forEach(a=>{
  if(a.triggered||normSym(a.src,a.sym)!==curSym)return;
  
  let targetP=a.price;
  let prevTargetP=a.price;
  
  if(a.type==='trend'&&a.trend){
   const dt=a.trend.t2-a.trend.t1;
   if(dt!==0){
    targetP=a.trend.p1+(a.trend.p2-a.trend.p1)*(b.t-a.trend.t1)/dt;
    prevTargetP=prevB&&dt!==0?a.trend.p1+(a.trend.p2-a.trend.p1)*(prevB.t-a.trend.t1)/dt:targetP;
   }else{
    targetP=a.trend.p1;
    prevTargetP=a.trend.p1;
   }
  }

  let hit=false;
  const cond=a.condition||'cross';
  if(cond==='reach'){
   hit=b.h>=targetP&&b.l<=targetP;
  }else if(cond==='close_above'){
   hit=b.c>targetP&&(prevB?prevB.c<=prevTargetP:true);
  }else if(cond==='close_below'){
   hit=b.c<targetP&&(prevB?prevB.c>=prevTargetP:true);
  }else{ // 'cross'
   if(prevB){
    hit=(prevB.c<=prevTargetP&&b.c>=targetP)||
        (prevB.c>=prevTargetP&&b.c<=targetP)||
        (b.h>=targetP&&b.l<=targetP&&(prevB.c<prevTargetP||prevB.c>prevTargetP));
   }else{
    hit=b.h>=targetP&&b.l<=targetP;
   }
  }

  if(hit){
   a.triggered=true;
   SV('alerts',alerts);
   updateAlertsUI();
   playChime();
   status(`🔔 Alert: ${a.sym} ${a.note||fmt(targetP)}!`,0);
   sched();
  }
 });
}

function upsert(b){
 const l=raw[raw.length-1];
 if(l&&l.t===b.t)raw[raw.length-1]=b;
 else if(!l||b.t>l.t)raw.push(b);
 checkAlerts(b);
 if(!rb)rb=setTimeout(()=>{rb=0;rebuild();sched()},200);
}

function bucket(t,ms){
 const DY=864e5;
 if(tfmin>=43200){const n=Math.round(tfmin/43200),d=new Date(t),k=Math.floor((d.getUTCFullYear()*12+d.getUTCMonth())/n)*n;return Date.UTC(Math.floor(k/12),k%12,1)}
 if(tfmin>=10080&&tfmin%10080===0){const o=4*DY;return Math.floor((t-o)/ms)*ms+o}
 return Math.floor(t/ms)*ms;
}

function agg(a,ms){
 const o=[];
 for(const b of a){
  const t=bucket(b.t,ms),l=o[o.length-1];
  if(l&&l.t===t){l.h=Math.max(l.h,b.h);l.l=Math.min(l.l,b.l);l.c=b.c}
  else o.push({t,o:b.o,h:b.h,l:b.l,c:b.c});
 }
 return o;
}

function rebuild(){
 D=Dfull=base===tfmin?raw.map(b=>({...b})):agg(raw,tfms);
 if(cfg.gapFree)for(let i=1;i<D.length;i++){const b=D[i];b.o=D[i-1].c;b.h=Math.max(b.h,b.o);b.l=Math.min(b.l,b.o)}
 if(rp&&!rp.pick)rp.n=nFromT();
 applyView();
}

/* ---------- Fair Value Gap (FVG) Logic (Reliable Timestamp Bounding) ---------- */
function applyView(){
 D=rp&&!rp.pick?Dfull.slice(0,rp.n):Dfull;
 const n=D.length,k=Math.min(14,n);
 let s=0;for(let i=n-k;i<n;i++)s+=D[i].h-D[i].l;
 atr=k?s/k:1;
 fvgs=[];
 for(let i=2;i<n;i++){
  const a=D[i-2],c=D[i];
  let up,top,bot;
  if(c.l>a.h){up=1;top=c.l;bot=a.h} // Bullish gap
  else if(c.h<a.l){up=0;top=a.l;bot=c.h} // Bearish gap
  else continue;
  if((top-bot)/c.c*100<(cfg.fvgMin||0.01))continue;
  let end=-1,endT=-1;
  for(let j=i+1;j<n;j++){
   if(up?D[j].l<=bot:D[j].h>=top){
    end=j;endT=D[j].t;break;
   }
  }
  // Store exact timestamps so zooming and panning never desyncs FVG zones
  fvgs.push({t:D[i-1].t,endT,e:end,up,top,bot});
 }
}

function live(my,iv){

  const cleanSym=S.sym.toLowerCase().replace(/[/_-]/g,'');
  const wsMirrors=[
   `wss://data-stream.binance.vision/ws/${cleanSym}@kline_${iv}`,
   `wss://stream.binance.com:9443/ws/${cleanSym}@kline_${iv}`
  ];
  let curMirror=0;
  const open=()=>{
   const url=wsMirrors[curMirror%wsMirrors.length];
   ws=new WebSocket(url);
   ws.onmessage=e=>{
    try{
     const k=JSON.parse(e.data).k;
     if(k)upsert({t:k.t,o:+k.o,h:+k.h,l:+k.l,c:+k.c});
    }catch{}

   ws.onerror=()=>{try{ws.close()}catch{}};
  };open();
 }else if(S.src==='gate'){

   ws.onopen=()=>{

   };
   ws.onmessage=e=>{
    try{const d=JSON.parse(e.data);if(d.event==='update'&&d.result){const k=d.result;upsert({t:+k.t*1000,o:+k.o,h:+k.h,l:+k.l,c:+k.c})}}catch{}
   };
   ws.onclose=()=>{clearInterval(ping);if(my===loadId)setTimeout(()=>my===loadId&&open(),2500)};
   ws.onerror=()=>{try{ws.close()}catch{}};
  };open();
 }else if(S.src==='fh'){
   poll=setInterval(async()=>{try{(await fetchFh(S.sym,iv,2)).forEach(upsert)}catch{}},15000);
  }else{
   poll=setInterval(async()=>{try{(await fetchTd(S.sym,iv,2)).forEach(upsert)}catch{}},20000);
  }
}

/* ---------- Drawing Engine & Interactive Manipulation ---------- */
function render(d,isSel){
 ctx.strokeStyle=ctx.fillStyle=d.color;ctx.lineWidth=d.w;ctx.setLineDash([]);
 const P=d.pts.map(q=>[X(q.t),Y(q.p)]);
 if(d.type==='hline'){
  ctx.beginPath();ctx.moveTo(0,P[0][1]);ctx.lineTo(pw,P[0][1]);ctx.stroke();
 }
 else if(d.type==='hray'){
  ctx.beginPath();ctx.moveTo(P[0][0],P[0][1]);ctx.lineTo(pw,P[0][1]);ctx.stroke();
 }
 else if(d.type==='vline'){
  ctx.beginPath();ctx.moveTo(P[0][0],0);ctx.lineTo(P[0][0],ph);ctx.stroke();
 }
 else if(d.type==='rect'){
  const[a,b]=P;ctx.globalAlpha=.15;ctx.fillRect(a[0],a[1],b[0]-a[0],b[1]-a[1]);ctx.globalAlpha=1;ctx.strokeRect(a[0],a[1],b[0]-a[0],b[1]-a[1]);
 }
 else if(d.s!=null){
  const lg=d.type==='long',[a,b]=P,x1=Math.min(a[0],b[0]),w=Math.abs(b[0]-a[0]),ye=a[1],ys=Y(d.s),yt=Y(d.tg),e=d.pts[0].p;
  ctx.fillStyle='rgba(38,166,154,.28)';ctx.fillRect(x1,Math.min(ye,yt),w,Math.abs(yt-ye));
  ctx.fillStyle='rgba(239,83,80,.28)';ctx.fillRect(x1,Math.min(ye,ys),w,Math.abs(ys-ye));
  ctx.strokeStyle='#9aa3b2';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x1,ye);ctx.lineTo(x1+w,ye);ctx.stroke();
  const sg=lg?1:-1,tp=(d.tg-e)/e*100*sg,sp=(d.s-e)/e*100*sg,rr=Math.abs(d.tg-e)/(Math.abs(e-d.s)||1e-12),cx=x1+w/2;
  ctx.font='11px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';
  ctx.fillText(`Target ${fmt(d.tg)} (${tp>=0?'+':''}${tp.toFixed(2)}%)`,cx,yt+(yt<ye?13:-5));
  ctx.fillText(`Stop ${fmt(d.s)} (${sp>=0?'+':''}${sp.toFixed(2)}%)`,cx,ys+(ys<ye?13:-5));
  ctx.fillText(`${lg?'Long':'Short'} · R:R ${rr.toFixed(2)}`,cx,ye-4);ctx.textAlign='left';
 }
 else{
  ctx.beginPath();P.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();
 }
 
 // Selection handles (circles for modifying vertices)
 if(isSel){
  for(const h of handles(d)){
   ctx.beginPath();ctx.arc(h.x,h.y,HR*.6,0,7);ctx.fillStyle='#fff';ctx.fill();
   ctx.strokeStyle='#2962ff';ctx.lineWidth=2;ctx.stroke();
  }
 }
}

function handles(d){
 const P=d.pts.map(q=>[X(q.t),Y(q.p)]);
 if(d.type==='rect'&&P.length>=2){
  const a=P[0],b=P[1];
  const x1=a[0],y1=a[1],x2=b[0],y2=b[1];
  const my=(y1+y2)/2;
  // 6 modification points: 4 corners + 2 horizontal side midpoints
  return [
   {x:x1,y:y1,k:'tl'}, // Top-Left
   {x:x2,y:y1,k:'tr'}, // Top-Right
   {x:x2,y:y2,k:'br'}, // Bottom-Right
   {x:x1,y:y2,k:'bl'}, // Bottom-Left
   {x:x1,y:my,k:'ml'}, // Mid-Left
   {x:x2,y:my,k:'mr'}  // Mid-Right
  ];
 }
 const H=P.map((p,i)=>({x:p[0],y:p[1],k:i}));
 if(d.type==='hline')H[0].x=pw/2;
 if(d.type==='hray')H[0].x=P[0][0];
 if(d.type==='vline')H[0].y=ph/2;
 if(d.s!=null){
  const mx=(P[0][0]+P[1][0])/2;
  H.push({x:mx,y:Y(d.s),k:'s'},{x:mx,y:Y(d.tg),k:'tg'});
 }
 return H;
}

const segD=(px,py,x1,y1,x2,y2)=>{const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy;let t=l?((px-x1)*dx+(py-y1)*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-x1-t*dx,py-y1-t*dy)};

function hit(x,y){
 for(let k=drs.length;k--;){
  const d=drs[k],P=d.pts.map(q=>[X(q.t),Y(q.p)]);
  let ok=false;
  if(d.type==='hline')ok=Math.abs(y-P[0][1])<TH;
  else if(d.type==='hray')ok=x>=P[0][0]-TH&&Math.abs(y-P[0][1])<TH;
  else if(d.type==='vline')ok=Math.abs(x-P[0][0])<TH;
  else if(d.type==='rect'){const[a,b]=P;ok=x>=Math.min(a[0],b[0])-4&&x<=Math.max(a[0],b[0])+4&&y>=Math.min(a[1],b[1])-4&&y<=Math.max(a[1],b[1])+4}
  else if(d.s!=null){const ys=[P[0][1],Y(d.s),Y(d.tg)];ok=x>=Math.min(P[0][0],P[1][0])&&x<=Math.max(P[0][0],P[1][0])&&y>=Math.min(...ys)&&y<=Math.max(...ys)}
  else for(let i=0;i<P.length-1;i++)if(segD(x,y,...P[i],...P[i+1])<TH){ok=true;break}
  if(ok)return d;
 }
}

function finishPoly(){
 if(!draft||draft.type!=='poly')return;
 const p=draft.pts;p.pop();
 while(p.length>1){
  const a=p[p.length-1],b=p[p.length-2];
  if(Math.hypot(X(a.t)-X(b.t),Y(a.p)-Y(b.p))<4)p.pop();else break;
 }
 if(p.length>=2)commit(draft);else{draft=null;sched()}
}

/* ---------- Replay ---------- */
function startRp(){if(rp){exitRp();return}rp={T:D[Math.max(0,D.length-60)].t,speed:+$('rsp').value||5,play:0,n:0};
 $('rp').hidden=false;$('rpbtn').textContent='Exit replay';rebuild();sched()}

function setPlay(p){if(!rp)return;rp.play=p;$('rpl').textContent=p?'⏸':'▶';clearInterval(playT);playT=0;
 if(p){const ms=Math.max(20,1000/(rp.speed||5));playT=setInterval(()=>{if(!rp||!rp.play)return;if(rp.n>=Dfull.length){setPlay(0);return}step(1)},ms)}}
function togglePlay(){if(rp)setPlay(rp.play?0:1)}

/* ---------- Main Chart Rendering ---------- */
function draw(){
 raf=0;if(!W||!H)return;
 ctx.fillStyle=cfg.bg;ctx.fillRect(0,0,W,H);
 if(!D.length){
  ctx.fillStyle='#888';ctx.font='14px system-ui';ctx.textAlign='center';
  ctx.fillText('No data available',W/2,H/2);ctx.textAlign='left';return;
 }
 const n=D.length,i0=Math.max(0,Math.floor(idxAt(0))),i1=Math.min(n-1,Math.ceil(idxAt(pw)));
 let l=Infinity,h=-Infinity;
 for(let i=i0;i<=i1;i++){const b=D[i];if(b.l<l)l=b.l;if(b.h>h)h=b.h}
 if(!isFinite(l)||l===h){l=D[n-1].c*.99;h=D[n-1].c*1.01}
 
 // TradingView-style vertical scaling & padding
 const span=(h-l);
 const pad=span*0.16;
 const mid=(h+l)/2;
 const halfSpan=(span/2+pad)*vZoom;
 lo=mid-halfSpan+vShift;
 hi=mid+halfSpan+vShift;

 // Grid lines
 ctx.strokeStyle=cfg.grid;ctx.lineWidth=1;ctx.beginPath();
 const yStep=nice(hi-lo,Math.max(3,ph/60));
 for(let p=Math.ceil(lo/yStep)*yStep;p<=hi;p+=yStep){const y=Math.round(Y(p))+.5;ctx.moveTo(0,y);ctx.lineTo(pw,y)}
 const tStep=nice((xAt(i1)-xAt(i0))/bw*tfmin,Math.max(3,pw/100));
 for(let i=i0;i<=i1;i++){
  const b=D[i];
  if(Math.floor(b.t/6e4/tStep)!==Math.floor((i?D[i-1].t:0)/6e4/tStep)){
   const x=Math.round(xAt(i))+.5;ctx.moveTo(x,0);ctx.lineTo(x,ph);
  }
 }
 ctx.stroke();

 // Fair Value Gaps (FVG) - Timestamp Bounded
 if(cfg.fvgOn&&fvgs&&fvgs.length){
  const list=[...fvgs.filter(f=>f.e<0).slice(-Math.min(20,cfg.fvgMax||20))];
  if(cfg.fvgMit)list.push(...fvgs.filter(f=>f.e>=0).slice(-Math.min(10,cfg.fvgMax||10)));
  for(const f of list){
   const x1=Math.max(0,X(f.t)-bw/2);
   const x2=f.endT<0?pw:Math.min(pw,X(f.endT)+bw/2);
   if(x2<=x1||x2<0||x1>pw)continue;
   const y1=Y(f.top),y2=Y(f.bot);
   const boxH=Math.abs(y2-y1),topY=Math.min(y1,y2);
   if(boxH<1||topY>ph||topY+boxH<0)continue;
   const baseOp=cfg.fvgOp||0.15;
   const op=f.e<0?Math.min(0.18,baseOp):Math.min(0.08,baseOp*0.35);
   ctx.fillStyle=rgba(f.up?cfg.fvgUp:cfg.fvgDn,op);
   ctx.fillRect(x1,topY,x2-x1,boxH);
  }
 }

 // Active Alerts (Dashed gold lines & badges on chart/axis)
 if(alerts.length){
  alerts.forEach(a=>{
   if(a.triggered||normSym(a.src,a.sym)!==normSym(S.src,S.sym))return;
   if(a.type==='trend'&&a.trend){
    const midT=(a.trend.t1+a.trend.t2)/2;
    const dt=a.trend.t2-a.trend.t1;
    const midP=dt!==0?a.trend.p1+(a.trend.p2-a.trend.p1)*0.5:a.trend.p1;
    const ax=X(midT),ay=Y(midP);
    if(ax>=0&&ax<=pw&&ay>=0&&ay<=ph){
     ctx.fillStyle='#f59e0b';ctx.beginPath();ctx.arc(ax,ay-12,8,0,7);ctx.fill();
     ctx.fillStyle='#000';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText('🔔',ax,ay-8);
    }
   }else if(a.price!=null){
    const ay=Y(a.price);
    if(ay>=0&&ay<=ph){
     ctx.strokeStyle='#f59e0b';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.beginPath();
     ctx.moveTo(0,Math.round(ay)+.5);ctx.lineTo(pw,Math.round(ay)+.5);ctx.stroke();ctx.setLineDash([]);
     ctx.fillStyle='#f59e0b';ctx.fillRect(pw,ay-8,AX,16);
     ctx.fillStyle='#000';ctx.font='10px system-ui';ctx.textAlign='left';
     ctx.fillText('🔔 '+fmt(a.price),pw+4,ay+4);
    }
   }
  });
 }

 // Candlesticks
 const bwC=Math.max(1,bw*.7),half=bwC/2;
 for(let i=i0;i<=i1;i++){
  const b=D[i],x=xAt(i),up=b.c>=b.o,yo=Y(b.o),yc=Y(b.c),yh=Y(b.h),yl=Y(b.l);
  ctx.strokeStyle=up?cfg.wickUp:cfg.wickDn;ctx.beginPath();ctx.moveTo(Math.round(x)+.5,yh);ctx.lineTo(Math.round(x)+.5,yl);ctx.stroke();
  ctx.fillStyle=up?cfg.up:cfg.dn;const top=Math.min(yo,yc),bh=Math.max(1,Math.abs(yo-yc));
  ctx.fillRect(x-half,top,bwC,bh);ctx.strokeRect(x-half,top,bwC,bh);
 }

 // Render committed and draft drawings
 drs.forEach(d=>render(d,d===sel));
 if(draft)render(draft,false);

 // Axes backgrounds
 ctx.fillStyle='#151a23';ctx.fillRect(pw,0,AX,H);ctx.fillRect(0,ph,W,AY);
 ctx.strokeStyle='#232a36';ctx.beginPath();ctx.moveTo(pw+.5,0);ctx.lineTo(pw+.5,ph);ctx.moveTo(0,ph+.5);ctx.lineTo(pw,ph+.5);ctx.stroke();

 // Price axis labels
 ctx.fillStyle='#9aa3b2';ctx.font='11px system-ui';ctx.textAlign='left';
 for(let p=Math.ceil(lo/yStep)*yStep;p<=hi;p+=yStep){ctx.fillText(fmt(p),pw+6,Y(p)+4)}

 // Time axis labels
 ctx.textAlign='center';
 for(let i=i0;i<=i1;i++){
  const b=D[i];
  if(Math.floor(b.t/6e4/tStep)!==Math.floor((i?D[i-1].t:0)/6e4/tStep)){
   const d=new Date(b.t),s=tfmin>=1440?d.toLocaleDateString(undefined,{month:'short',day:'numeric'}):d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
   ctx.fillText(s,xAt(i),ph+17);
  }
 }

 // Precision Crosshair (Centered with Pin Effect when Magnet is ON)
 if(m&&m.y>=0&&m.y<ph){
  const isOverChart=m.x>=0&&m.x<pw;
  let chX=m.x,chY=m.y,isPinned=false;
  if(magnetOn&&isOverChart){
   const sn=getSnapped(m.x,m.y);
   if(sn.snapped){
    chX=sn.x;chY=sn.y;isPinned=true;
   }
  }

  ctx.strokeStyle=isPinned?'#00e676':'#4a5568';
  ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.beginPath();
  ctx.moveTo(0,Math.round(chY)+.5);ctx.lineTo(pw,Math.round(chY)+.5);
  if(isOverChart){
   ctx.moveTo(Math.round(chX)+.5,0);ctx.lineTo(Math.round(chX)+.5,ph);
  }
  ctx.stroke();ctx.setLineDash([]);
  
  // Price tag on price axis
  const p=pAt(chY);
  ctx.fillStyle='#2962ff';ctx.fillRect(pw,chY-10,AX,20);
  ctx.fillStyle='#fff';ctx.textAlign='left';ctx.fillText(fmt(p),pw+22,chY+4);
  
  // (+) Icon on price axis / at end of horizontal line (TradingView UI)
  ctx.beginPath();ctx.arc(pw+10,chY,7,0,7);ctx.fillStyle='#1e2638';ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
  ctx.beginPath();ctx.moveTo(pw+7,chY);ctx.lineTo(pw+13,chY);ctx.moveTo(pw+10,chY-3);ctx.lineTo(pw+10,chY+3);ctx.stroke();
  
  // Time tag & OHLC
  if(isOverChart){
   const curI=Math.round(idxAt(chX));
   if(curI>=0&&curI<n){
    const b=D[curI],d=new Date(b.t),s=d.toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    ctx.fillRect(chX-45,ph,90,18);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(s,chX,ph+13);
    $('ohlc').innerHTML=`<span style="color:#fff;font-weight:600">${S.sym} · ${S.tf}</span> O:${fmt(b.o)} H:${fmt(b.h)} L:${fmt(b.l)} C:${fmt(b.c)} <span style="color:${b.c>=b.o?'#26a69a':'#ef5350'}">${((b.c-b.o)/b.o*100).toFixed(2)}%</span>`;
   }

   // Visual Pin Ring when Magnet snaps to OHLC
   if(isPinned){
    ctx.beginPath();ctx.arc(chX,chY,4.5,0,7);ctx.fillStyle='#00e676';ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
   }
  }
 }

 // Last price tag, horizontal dotted line, and Bar Close Countdown (TradingView UI)
 const curB=D[n-1];
 if(curB){
  const y=Y(curB.c);
  // Horizontal dotted line for current price (0.8px TradingView style)
  ctx.save();
  ctx.strokeStyle=curB.c>=curB.o?'#26a69a':'#ef5350';
  ctx.lineWidth=0.8;
  ctx.setLineDash([2,3]);
  ctx.beginPath();
  ctx.moveTo(0,Math.round(y)+.5);
  ctx.lineTo(pw,Math.round(y)+.5);
  ctx.stroke();
  ctx.restore();

  ctx.fillStyle=curB.c>=curB.o?'#26a69a':'#ef5350';ctx.fillRect(pw,y-10,AX,20);
  ctx.fillStyle='#fff';ctx.textAlign='left';ctx.fillText(fmt(curB.c),pw+6,y+4);
  
  // Bar countdown (HH:MM:SS remaining until candle closes)
  const nextBarT=curB.t+tfms;
  const remMs=Math.max(0,nextBarT-Date.now());
  const remSec=Math.floor(remMs/1000);
  const hrs=Math.floor(remSec/3600);
  const mins=Math.floor((remSec%3600)/60);
  const secs=remSec%60;
  const cdStr=(hrs>0?String(hrs).padStart(2,'0')+':':'')+String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0');
  
  ctx.fillStyle='#1c2330';ctx.fillRect(pw+1,y+11,AX-2,15);
  ctx.strokeStyle='#2a3342';ctx.strokeRect(pw+1,y+11,AX-2,15);
  ctx.fillStyle='#9aa3b2';ctx.font='10px system-ui';ctx.textAlign='center';
  ctx.fillText(cdStr,pw+AX/2,y+22);
 }
}

  id:Date.now(),

cv.onpointerdown=e=>{
 cv.setPointerCapture(e.pointerId);
 const[x,y]=pos(e);m={x,y};ptrs.set(e.pointerId,[x,y]);
 if(ptrs.size===2){
  const[a,b]=[...ptrs.values()];
  pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,bw:bw,idx:idxAt((a[0]+b[0])/2)};
  drag=null;draft=null;return;
 }
 if(!D.length)return;
 down={x,y};

 // Click on (+) button on price axis / crosshair line to create Alert
 if(m&&Math.abs(y-m.y)<=14&&(x>=pw-12&&x<=pw+25)){
  openCreateAlert({type:'price',price:pAt(m.y)});
  return;
 }

 // Dragging on price axis scales price vertically (TradingView feature)
 if(x>=pw&&y<ph){
  drag={type:'vscale',y0:y,shift0:vShift,zoom0:vZoom};
  return;
 }

 // Dragging on time axis stretches / zooms time horizontally!
 if(y>=ph&&x<pw){
  drag={type:'hscale',x0:x,bw0:bw,off0:off};
  return;
 }

 if(x>pw||y>ph)return;

 if(rp&&rp.pick){
  const i=Math.max(0,Math.min(D.length-1,Math.round(idxAt(x))));
  rp.n=i+1;rp.T=endT(i);rp.pick=false;status('');applyView();sched();return;
 }

 // Drawing creation
 if(tool!=='cursor'){
  const p=pt(x,y);
  if(tool==='hline'||tool==='vline'||tool==='hray'){
   commit({type:tool,pts:[p],w:dw,color:dcol});
  }else if(tool==='long'||tool==='short'){
   const lg=tool==='long',r=atr*1.5;
   commit({type:tool,pts:[p,{t:tOf(idxAt(x)+25),p:p.p}],s:lg?p.p-r:p.p+r,tg:lg?p.p+2*r:p.p-2*r,w:dw,color:dcol});
  }else if(tool==='poly'){
   if(!draft)draft={type:'poly',pts:[p,{...p}],w:dw,color:dcol};
   else{draft.pts[draft.pts.length-1]=p;draft.pts.push({...p})};
  }else{
   if(!draft)draft={type:tool,pts:[p,{...p}],w:dw,color:dcol,sx:x,sy:y};
   else{
    draft.pts[1]=p;
    commit(draft);
   }
  }
  sched();return;
 }

 // Check for clicking handles of selected drawing to edit
 const hd=sel&&handles(sel).find(h=>Math.hypot(h.x-x,h.y-y)<HR);
 if(hd){
  drag={type:'h',k:hd.k};
  return;
 }

 // Check for clicking existing drawing
 const h=hit(x,y);
 if(h){
  sel=h;
  drag={type:'move',i0:idxAt(x),p0:pAt(y),orig:JSON.parse(JSON.stringify(h))};
  $('w').value=h.w+'px';$('col').value=h.color;
  updateDrMenu();
 }else{
  sel=null;
  $('dr-menu').hidden=true;
  // Dragging chart allows BOTH horizontal and vertical panning!
  drag={type:'pan',off,vShift};
 }
 sched();
};

cv.onpointermove=e=>{
 const[x,y]=pos(e);m={x,y};
 if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,[x,y]);
 if(pinch&&ptrs.size===2){
  const[a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1])||1,mx=(a[0]+b[0])/2;
  bw=Math.max(1.5,Math.min(60,pinch.bw*d/pinch.d));
  off=pinch.idx-(mx-pw)/bw-(D.length-1);
  sched();return;
 }

 if(draft){
  draft.pts[draft.pts.length-1]=pt(x,y);
 }

 // Dragging a handle to modify drawing
 if(drag&&sel&&drag.type==='h'){
  if(!drag.s){snap();drag.s=1}
  const sn=magnetOn?getSnapped(x,y):{p:pAt(y),t:tOf(idxAt(x))};
  const k=drag.k,t=sn.t,p=sn.p;
  if(k==='s')sel.s=p;
   else if(k==='tg')sel.tg=p;
   else if(sel.s!=null&&k===1){sel.pts[1]={t,p:sel.pts[0].p}}
   else if(sel.s!=null&&k===0){sel.pts[0]={t,p};sel.pts[1].p=p}
   else if(k==='tl'){sel.pts[0]={t,p}}
   else if(k==='tr'){sel.pts[1].t=t;sel.pts[0].p=p}
   else if(k==='br'){sel.pts[1]={t,p}}
   else if(k==='bl'){sel.pts[0].t=t;sel.pts[1].p=p}
   else if(k==='ml'){sel.pts[0].t=t}
   else if(k==='mr'){sel.pts[1].t=t}
   else if(sel.type==='rect'&&k===2){sel.pts[1].t=t;sel.pts[0].p=p}
   else if(sel.type==='rect'&&k===0){sel.pts[0]={t,p}}
   else if(sel.type==='rect'&&k===1){sel.pts[1]={t,p}}
   else sel.pts[k]={t,p};
  updateDrMenu();
 }
 // Dragging the whole drawing
 else if(drag&&drag.type==='move'){
  if(!drag.s){snap();drag.s=1}
  const di=idxAt(x)-drag.i0,dp=pAt(y)-drag.p0;
  sel.pts=drag.orig.pts.map(q=>({t:tOf(idxOf(q.t)+di),p:q.p+dp}));
  if(sel.s!=null){sel.s=drag.orig.s+dp;sel.tg=drag.orig.tg+dp}
  updateDrMenu();
 }
 // Vertical scale zoom on price axis
 else if(drag&&drag.type==='vscale'){
  const dy=y-drag.y0;
  vZoom=Math.max(0.15,Math.min(8,drag.zoom0*Math.exp(dy*0.007)));
 }
 // Horizontal scale zoom by dragging time axis
 else if(drag&&drag.type==='hscale'){
  const dx=x-drag.x0;
  bw=Math.max(1.5,Math.min(60,drag.bw0*Math.exp(dx*0.005)));
 }
 // Two-way chart panning (both horizontal and vertical!)
 else if(drag&&drag.type==='pan'){
  off=Math.max(-(D.length-5),Math.min(300,drag.off-(x-down.x)/bw));
  const pPerPx=(hi-lo)/ph;
  vShift=drag.vShift+(y-down.y)*pPerPx;
 }
 sched();
};

cv.onpointerup=e=>{
 ptrs.delete(e.pointerId);
 if(ptrs.size<2)pinch=null;
 if(draft&&draft.sx!=null){
  const[x,y]=pos(e);
  if(Math.hypot(x-draft.sx,y-draft.sy)>6){
   draft.pts[1]=pt(x,y);
   commit(draft);
  }
 }
 if(drag&&drag.type!=='pan'&&drag.type!=='vscale'&&drag.type!=='hscale')saveDr();
 drag=null;
};

// Double-click resets vertical shift and scale (auto-fit price)
cv.ondblclick=e=>{
 const[x,y]=pos(e);
 if(x>=pw||y>=ph){vShift=0;vZoom=1;sched();return}
 finishPoly();
};

cv.onmouseleave=()=>{m=null;$('ohlc').innerHTML='';sched()};

// TradingView wheel controls:
// Vertical wheel (e.deltaY) scales price axis (vZoom)
// Horizontal wheel or Shift+Wheel scales horizontal time (bw)
cv.addEventListener('wheel',e=>{
 e.preventDefault();if(!D.length)return;
 if(e.ctrlKey){
  // Trackpad pinch gesture: zoom candle bar width (bw) centered at cursor
  const[x]=pos(e),idx=idxAt(x);
  bw=Math.max(1.5,Math.min(60,bw*Math.exp(-e.deltaY*0.005)));
  off=idx-(x-pw)/bw-(D.length-1);
  sched();return;
 }
 if(e.shiftKey||Math.abs(e.deltaX)>Math.abs(e.deltaY)){
  const dX=e.shiftKey?e.deltaY:e.deltaX;
  const[x]=pos(e),idx=idxAt(x);
  bw=Math.max(1.5,Math.min(60,bw*Math.exp(-dX*0.0015)));
  off=idx-(x-pw)/bw-(D.length-1);
 }else{
  vZoom=Math.max(0.15,Math.min(8,vZoom*Math.exp(e.deltaY*0.0012)));
 }
 sched();
},{passive:false});

addEventListener('keydown',e=>{
 if(/INPUT|SELECT/.test(document.activeElement.tagName))return;
 const mod=e.ctrlKey||e.metaKey;
 if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
 if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return}
 if(rp&&!rp.pick){
  if(e.key==='ArrowRight'){setPlay(0);step(1);return}
  if(e.key==='ArrowLeft'){setPlay(0);step(-1);return}
  if(e.key===' '){e.preventDefault();togglePlay();return}
 }
 if(e.key==='Escape'){
  draft=null;setTool('cursor');sel=null;sched();
  $('search-modal').hidden=true;
  $('alerts-modal').hidden=true;
  $('dr-menu').hidden=true;
 }
 else if(e.key==='Enter')finishPoly();
 else if((e.key==='Delete'||e.key==='Backspace')&&sel){
  snap();drs=drs.filter(d=>d!==sel);sel=null;
  $('dr-menu').hidden=true;
  saveDr();sched();
 }
});

/* ---------- Symbol Autocomplete & Search Modal (Fixed Position) ---------- */
let curCat='all';
let curBrk='all';

function renderSearchResults(query=''){
 const q=query.trim().toLowerCase();
 const seen=new Set();
 const combined=[];
 for(const p of PRESETS){
  if(curBrk==='gate'&&!p.sym)continue;
  if(curBrk==='bn'&&!p.bn)continue;
  if(curBrk==='fx'&&!p.fx)continue;
  if(curBrk==='fh'&&!p.fh)continue;

  let targetSrc = p.src || 'gate';
  if(curBrk==='gate')targetSrc='gate';
  else if(curBrk==='bn')targetSrc='bn';
  else if(curBrk==='fx')targetSrc='fx';
  else if(curBrk==='fh')targetSrc='fh';
  else if(p.fh && (p.cat==='fx'||p.name.includes('Index')||p.name.includes('225')||p.name.includes('500')||p.name.includes('100')||p.name.includes('30')))targetSrc='fh';

  let displaySym = (targetSrc==='fh'&&p.fh) ? p.fh : (targetSrc==='bn'&&p.bn) ? p.bn : (targetSrc==='fx'&&p.fx) ? p.fx : (p.sym||p.fx||p.fh||p.bn);
  const k = (targetSrc + ':' + displaySym).toUpperCase();
  if(!seen.has(k)){
   seen.add(k);
   combined.push({sym:displaySym,src:targetSrc,name:p.name,cat:p.cat});
  }
 }
 if(curBrk==='all'||curBrk==='fx'){
  if(Array.isArray(tdSymbols)){
   for(const s of tdSymbols){
    const k=('fx:'+s.fx).toUpperCase();
    if(!seen.has(k)){
     seen.add(k);
     combined.push({sym:s.fx,src:'fx',name:s.name,cat:'fx'});
    }
   }
  }
 }
 const filtered=combined.filter(p=>{
  if(curCat==='crypto'&&p.cat!=='crypto')return false;
  if(curCat==='fx'&&p.cat!=='fx')return false;
  if(!q)return true;
  const symStr=(p.sym||'').toLowerCase();
  return symStr.includes(q)||(p.name&&p.name.toLowerCase().includes(q));
 }).slice(0,60);
 
 if(!filtered.length){
  const fallbackSrc = curBrk!=='all'?curBrk:(curCat==='fx'?'fx':S.src);
  $('search-results').innerHTML=`<div style="padding:16px;text-align:center;color:#8a919e">No preset found. Press Enter to load <b>"${query.toUpperCase()}"</b> directly via ${fallbackSrc==='gate'?'Gate.io':fallbackSrc==='bn'?'Binance':fallbackSrc==='fh'?'Finnhub':'Twelve Data'}.</div>`;
  return;
 }
 
 $('search-results').innerHTML=filtered.map(p=>{
  const brkLabel = p.src==='gate'?'Gate.io':p.src==='bn'?'Binance':p.src==='fh'?'Finnhub':'Twelve Data';
  return `
  <div class="s-item" data-sym="${p.sym}" data-src="${p.src}">
   ${symBadge(p.sym,p.src)}
   <div style="display:flex;flex-direction:column;flex:1;overflow:hidden">
    <span class="s-sym">${p.sym}</span>
    <span class="s-desc" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name||p.sym}</span>
   </div>
   <span class="s-tag">${brkLabel}</span>
  </div>
  `;
 }).join('');
}

 ['up','color','Candle Up Color'],['dn','color','Candle Down Color'],['wickUp','color','Up Wick Color'],['wickDn','color','Down Wick Color'],
 ['bg','color','Background Color'],['grid','color','Grid Line Color'],
 ['fvgOn','check','Show Fair Value Gaps (FVG)'],['fvgUp','color','Bullish FVG Color'],['fvgDn','color','Bearish FVG Color'],
 ['fvgOp','range','FVG Box Opacity'],['fvgMin','number','Min FVG Size (%)'],['fvgMax','number','Max FVG Boxes'],['fvgMit','check','Show Mitigated FVGs'],
 ['gapFree','check','Gap-Free Candles'],['fhKey','text','Finnhub API Key (Forex/Indices/CFD)'],['key','text','Twelve Data Key (Forex/Stocks)']
];

$('setbody').innerHTML='<b style="font-size:14px;color:#fff;display:block;margin-bottom:10px">Chart Settings</b>'+SPEC.map(s=>`
 <label>${s[2]}
  <input data-k="${s[0]}" type="${s[1]==='check'?'checkbox':s[1]}" ${s[1]==='range'?'min=".05" max=".8" step=".05"':''} ${s[1]==='number'?'step="any" style="width:80px"':''}>
 </label>
`).join('')+
 '<p>Crypto runs natively with Gate.io & Binance live WebSockets. Forex uses Twelve Data (EUR/USD works free in demo mode; add your personal key from twelvedata.com for full catalog).</p><button id="sclose" style="margin-top:12px;width:100%;padding:8px">Done</button>';

document.querySelectorAll('#setbody [data-k]').forEach(i=>{
 const k=i.dataset.k;
 if(i.type==='checkbox')i.checked=cfg[k];else i.value=cfg[k];
 i.onchange=i.oninput=()=>{
  cfg[k]=i.type==='checkbox'?i.checked:(i.type==='number'||i.type==='range')?+i.value:i.value;
  SV('cfg',cfg);
  if(k==='fvgOn')$('fvgtog').classList.toggle('on',cfg.fvgOn);
  if(k==='key'||k==='fhKey'){if(S.src==='fx'||S.src==='fh')load()}else{rebuild();sched()}
 };
});

$('gear').onclick=()=>$('set').hidden=false;
$('sclose').onclick=()=>$('set').hidden=true;
$('set').onclick=e=>{if(e.target.id==='set')$('set').hidden=true};

/* ---------- Watchlist Panel & Price Feeds ---------- */
function wlRender(){
 $('wsel').innerHTML=Object.keys(wls).map(k=>`<option ${k===wcur?'selected':''}>${k}</option>`).join('');
 const list=wls[wcur]||[];
 $('wi').innerHTML=list.map((x,i)=>{
  const isActive=(x.src===S.src&&normSym(x.src,x.sym)===normSym(S.src,S.sym));
  return `
  <div class="wi ${isActive?'active':''}" data-i="${i}">
   ${symBadge(x.sym,x.src)}
   <div class="sym-info">
    <div class="sym-name">${x.sym}</div>
    <div class="sym-src">${x.src==='gate'?'Gate.io':x.src==='bn'?'Binance':x.src==='fh'?'Finnhub':'Twelve Data'}</div>
   </div>
   <div class="sym-price" id="wp${i}">
    <span class="p-val">--</span>
   </div>
   <span class="del-btn" data-d="${i}" title="Remove from watchlist">✕</span>
  </div>
  `;
 }).join('');
 wlPrices();
}

async function wlPrices(){
 const L=wls[wcur]||[];
 // Gate.io symbols
 const gIdx=L.map((x,i)=>x.src==='gate'?i:-1).filter(i=>i>=0);
 for(const i of gIdx){
  try{
   const r=await fetch(`https://api.gateio.ws/api/v4/spot/tickers?currency_pair=${encodeURIComponent(L[i].sym)}`);
   const arr=await r.json();
   if(Array.isArray(arr)&&arr.length&&$('wp'+i)){
    const t=arr[0],c=+t.change_percentage;
    $('wp'+i).innerHTML=`<span class="p-val">${fmt(+t.last)}</span><span class="p-chg ${c>=0?'up':'dn'}">${c>=0?'+':''}${c.toFixed(2)}%</span>`;
   }
  }catch{}
 }
 // Binance symbols
 const bIdx=L.map((x,i)=>x.src==='bn'?i:-1).filter(i=>i>=0);
 if(bIdx.length){
  const syms=bIdx.map(i=>normSym('bn',L[i].sym));
  const bMirrors=[
   'https://data-api.binance.vision/api/v3/ticker/24hr',
   'https://api.binance.com/api/v3/ticker/24hr'
  ];
  for(const bm of bMirrors){
   try{
    const r=await fetch(bm+'?symbols='+encodeURIComponent(JSON.stringify(syms)),{signal:AbortSignal.timeout(3500)});
    const a=await r.json();
    if(Array.isArray(a)){
     a.forEach(t=>{
      bIdx.forEach(i=>{
       if(normSym('bn',L[i].sym)===t.symbol&&$('wp'+i)){
        const c=+t.priceChangePercent;
        $('wp'+i).innerHTML=`<span class="p-val">${fmt(+t.lastPrice)}</span><span class="p-chg ${c>=0?'up':'dn'}">${c>=0?'+':''}${c.toFixed(2)}%</span>`;
       }
      });
     });
     break;
    }
   }catch{}
  }
 }
 // Forex / Index symbols (Twelve Data)
 const fIdx=L.map((x,i)=>x.src==='fx'?i:-1).filter(i=>i>=0);
 for(const i of fIdx){
  try{
   const r=await fetch(`https://api.twelvedata.com/quote?symbol=${encodeURIComponent(L[i].sym)}&apikey=${cfg.key||'demo'}`);
   const q=await r.json();
   if(q&&q.close&&$('wp'+i)){
    const last=+q.close;
    const c=+q.percent_change||0;
    $('wp'+i).innerHTML=`<span class="p-val">${fmt(last)}</span><span class="p-chg ${c>=0?'up':'dn'}">${c>=0?'+':''}${c.toFixed(2)}%</span>`;
   }
  }catch{}
 }
 // Finnhub symbols (Forex, Indices, Stocks)
 const fhIdx=L.map((x,i)=>x.src==='fh'?i:-1).filter(i=>i>=0);
 for(const i of fhIdx){
  try{
   const r=await fetch(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(L[i].sym)}&token=${cfg.fhKey||''}`);
   const q=await r.json();
   if(q&&q.c&&$('wp'+i)){
    const last=+q.c;
    const c=+q.dp||0;
    $('wp'+i).innerHTML=`<span class="p-val">${fmt(last)}</span><span class="p-chg ${c>=0?'up':'dn'}">${c>=0?'+':''}${c.toFixed(2)}%</span>`;
   }
  }catch{}
 }
}

$('wi').onclick=e=>{
 const d=e.target.closest('[data-d]');
 if(d){
  wls[wcur].splice(+d.dataset.d,1);
  SV('wls',wls);wlRender();return;
 }
 const r=e.target.closest('[data-i]');
 if(r){
  const x=wls[wcur][+r.dataset.i];
  if(window.innerWidth<=700)$('wl').classList.remove('open');
  setSym(x.src,x.sym);
 }
};

$('wadd').onclick=()=>{
 if(!wls[wcur].some(x=>x.src===S.src&&normSym(x.src,x.sym)===normSym(S.src,S.sym))){
  wls[wcur].push({src:S.src,sym:S.sym});
  SV('wls',wls);wlRender();
  status('Added '+S.sym+' to watchlist');setTimeout(()=>status(''),2000);
 }
};

$('wsel').onchange=e=>{wcur=e.target.value;SV('wcur',wcur);wlRender()};
$('wnew').onclick=()=>{
 const n=(prompt('New watchlist name:')||'').trim().slice(0,24).replace(/[<>&"]/g,'');
 if(n&&!wls[n]){wls[n]=[];wcur=n;SV('wls',wls);SV('wcur',wcur);wlRender()}
};

setInterval(wlPrices,15000);

// 1-second ticker for Candle Countdown and Clock
setInterval(()=>{
 if(D.length)sched();
},1000);

// Watchlist toggle
$('wtog').onclick=()=>{
 if(window.innerWidth>700){
  $('app').classList.toggle('wl-collapsed');
  setTimeout(resize,210);
 }else{
  $('wl').classList.toggle('open');
 }
};

$('rpbtn').onclick=startRp;
$('more').onclick=loadMore;
async function loadMore(){
 if(!raw.length)return;
 status('Loading older bars…');
 try{
  const e=raw[0].t-1;let a=[];
  if(S.src==='bn')a=await fetchBn(S.sym,NB[base],4,e);
   else if(S.src==='gate')a=await fetchGate(S.sym,NG[base]||'1h',4,e);
   else if(S.src==='fh')a=await fetchFh(S.sym,NFh[base]||'60',500,e);
   else a=await fetchTd(S.sym,NF[base],5000,e);
  const have=new Set(raw.map(b=>b.t)),add=a.filter(b=>!have.has(b.t));
  if(!add.length){status('No older data available');setTimeout(()=>status(''),2500);return}
  raw=add.concat(raw);rebuild();status('');sched();
 }catch(err){status(err.message,1)}
}

$('rb').onclick=()=>{setPlay(0);step(-1)};
$('rf').onclick=()=>{setPlay(0);step(1)};
$('rpl').onclick=togglePlay;
$('rx').onclick=exitRp;

cv.onpointercancel=e=>{ptrs.delete(e.pointerId);pinch=null;drag=null};
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ---------- Bootstrap ---------- */
function resize(){
 const r=$('cw').getBoundingClientRect(),d=Math.max(1,window.devicePixelRatio||1);
 W=Math.round(r.width);H=Math.round(r.height);
 cv.width=Math.round(W*d);cv.height=Math.round(H*d);
 cv.style.width=W+'px';cv.style.height=H+'px';
 ctx.setTransform(d,0,0,d,0,0);
 ctx.imageSmoothingEnabled=false;
 pw=W-AX;ph=H-AY;sched();
}

addEventListener('resize',resize);
renderToolsUI();
updateAlertsUI();
$('fvgtog').classList.toggle('on',cfg.fvgOn);
resize();
setTool('cursor');
wlRender();
setSym(S.src,S.sym);
</script></body></html>
